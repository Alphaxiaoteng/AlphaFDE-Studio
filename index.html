<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云谷企服雷达智能匹配系统</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js" defer></script>
  <script src="static_db.js"></script>
  <script src="alpha_db.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
  </style>
  <style>
    :root {
      --bg: #f3f0ea;
      --paper: #faf8f4;
      --paper-soft: #f7f4ee;
      --side-bg: #efebe3;
      --ink: #161616;
      --muted: #8a857c;
      --line: #e0d9ce;
      --line-strong: #c9bfb0;
      --accent: #8c1d1d;
      --accent-soft: #f3e8e6;
      --ok: #2f5d3a;
      --ok-bg: #eef5f0;
      --warn: #8a5a12;
      --warn-bg: #f7f0e4;
      --bad: #8c1d1d;
      --bad-bg: #f7ecec;
      --seal: #0f6f4f;
      --radius: 12px;
      --radius-sm: 8px;
      --ease: 180ms ease;
      --shadow-sm: 0 1px 2px rgba(28, 28, 28, 0.04), 0 1px 8px rgba(28, 28, 28, 0.03);
      --shadow-md: 0 4px 14px rgba(28, 28, 28, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 100% 0%, rgba(15, 111, 79, 0.04), transparent 55%),
        linear-gradient(180deg, #faf8f4 0%, var(--bg) 40%, #f3f0ea 100%);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .app { display: flex; flex: 1; min-height: 0; }
    .side {
      width: 228px;
      background: linear-gradient(180deg, #f2eee6 0%, var(--side-bg) 100%);
      border-right: 1px solid var(--line-strong);
      box-shadow: 4px 0 18px rgba(28, 28, 28, 0.04);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      gap: 4px;
      z-index: 2;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 6px 18px; border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }
    .logo {
      width: 42px; height: 42px;
      border: 1.5px solid var(--seal);
      border-radius: 10px;
      color: var(--seal);
      background: var(--paper-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      flex-shrink: 0;
    }
    .logo svg { width: 18px; height: 18px; display: block; }
    .logo span {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.12em;
      line-height: 1;
      margin-left: 0.12em;
    }
    .brand-copy { min-width: 0; flex: 1; }
    .brand h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .brand h1 .brand-line { display: block; }
    .brand p { margin: 3px 0 0; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
    .nav-btn {
      display: flex; align-items: flex-start; gap: 10px;
      text-align: left;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.35;
      transition: background var(--ease), color var(--ease), box-shadow var(--ease), transform var(--ease);
    }
    .nav-btn .nav-ico {
      width: 28px; height: 28px; flex: none;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.55);
      display: grid; place-items: center;
      margin-top: 1px;
      transition: background var(--ease);
    }
    .nav-btn .nav-ico svg { width: 16px; height: 16px; display: block; }
    .nav-btn .nav-txt { min-width: 0; flex: 1; }
    .nav-btn:hover { background: rgba(255,255,255,0.55); }
    .nav-btn.active {
      background: #eef6f2;
      color: var(--seal);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .nav-btn.active .nav-ico { background: #dff0e8; }
    .nav-btn small { display: block; color: var(--muted); margin-top: 2px; font-size: 11px; font-weight: 400; }
    .side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .side-foot select {
      width: 100%; margin-top: 8px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--paper-soft); font-family: inherit; font-size: 12px;
    }
    .portal-switch {
      display: flex; gap: 2px; margin-bottom: 12px; padding: 3px;
      background: rgba(255,255,255,0.55); border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }
    .portal-btn {
      flex: 1; border: 0; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12px; color: var(--muted);
      padding: 7px 6px; border-radius: calc(var(--radius-sm) - 2px);
      transition: background var(--ease), color var(--ease);
    }
    .portal-btn:hover { color: var(--ink); }
    .portal-btn.on {
      background: #eef6f2; color: var(--seal); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .side-foot .foot-block { margin-top: 2px; }
    .nav-btn[hidden] { display: none !important; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: transparent; }
    .topbar {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 14px 22px; border-bottom: 1px solid var(--line);
      font-size: 12px; color: var(--muted); background: rgba(255,255,255,.55);
    }
    .topbar strong { color: var(--ink); font-weight: 500; }
    .content { flex: 1; overflow: auto; padding: 18px 22px 28px; }
    textarea, .form-grid input, .form-grid select, .form-grid textarea {
      flex: 1; border: 1px solid var(--line); background: var(--paper-soft);
      font-family: inherit; font-size: 13px; padding: 10px 12px; resize: vertical;
      width: 100%; border-radius: var(--radius-sm);
    }
    .draft-inline {
      margin-top: 10px; padding: 12px; border: 1px solid var(--line);
      background: #fafcfa; border-radius: var(--radius);
    }
    .draft-inline label {
      display: block; font-size: 11px; color: var(--muted);
      margin-bottom: 6px; letter-spacing: 0.06em;
    }
    .draft-inline pre {
      margin: 0 0 10px; white-space: pre-wrap; word-break: break-word;
      font-family: inherit; font-size: 13px; line-height: 1.55; color: var(--ink);
    }
    .skills-hero {
      max-width: 720px; margin: 8px auto 0;
    }
    .skills-hero h2 {
      margin: 0 0 8px; font-family: "Noto Serif SC", serif;
      font-size: 26px; font-weight: 600; letter-spacing: 0.04em;
    }
    .skills-hero .lead {
      margin: 0 0 18px; font-size: 14px; color: var(--muted); line-height: 1.6;
    }
    .platform-pills {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }
    .platform-pill {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line); background: var(--paper-soft); color: var(--ink);
      padding: 7px 12px 7px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
      border-radius: 999px;
    }
    .platform-pill svg { width: 16px; height: 16px; flex: none; display: block; }
    .platform-pill.on {
      border-color: var(--seal); color: var(--seal); background: #eef6f2; font-weight: 600;
    }
    .platform-pill.denied {
      opacity: 0.48; cursor: not-allowed; color: var(--muted);
      background: #f0ebe3; border-style: dashed;
    }
    .platform-pill.denied.on { font-weight: 500; color: var(--muted); border-color: var(--line); background: #f0ebe3; }
    .platform-pill .deny-tag {
      font-size: 10px; color: var(--bad); letter-spacing: 0.04em; margin-left: 2px;
    }
    .perms-wrap { max-width: 1080px; }
    .perms-wrap h2 {
      margin: 0 0 6px; font-family: "Noto Serif SC", serif;
      font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
    }
    .perms-sec { margin-top: 18px; }
    .perms-sec h3 {
      margin: 0 0 8px; font-size: 14px; font-weight: 600;
      letter-spacing: 0.03em; color: var(--ink);
    }
    .perms-sec .sec-hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
    .perms-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; background: var(--paper-soft); border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--line);
    }
    .perms-table th, .perms-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
      vertical-align: middle;
    }
    .perms-table th {
      font-size: 11px; color: var(--muted); font-weight: 500;
      letter-spacing: 0.04em; background: rgba(255,255,255,0.55);
    }
    .perms-table tr:last-child td { border-bottom: none; }
    .perms-table .user-cell { min-width: 140px; }
    .perms-table .user-cell strong { display: block; font-weight: 600; }
    .perms-table .user-cell span { font-size: 11px; color: var(--muted); }
    .perms-table label.chk {
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; white-space: nowrap; font-size: 12px;
    }
    .perms-table input[type="checkbox"] { accent-color: var(--seal); width: 14px; height: 14px; }
    .source-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .source-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); background: var(--paper-soft); color: var(--ink);
      padding: 3px 8px; font-size: 12px; text-decoration: none;
      border-radius: 999px;
    }
    .source-chip svg { width: 14px; height: 14px; flex: none; display: block; }
    .source-chip.sample { color: var(--muted); background: #f6f4ef; }
    .stage-path { margin-top: 6px; font-size: 12px; color: var(--seal); letter-spacing: 0.03em; }
    .timeline { list-style: none; margin: 8px 0 0; padding: 0; }
    .timeline li {
      display: grid; grid-template-columns: 14px 1fr; gap: 10px;
      position: relative; padding-bottom: 12px;
    }
    .timeline li:before {
      content: ""; position: absolute; left: 6px; top: 10px; bottom: 0; width: 1px; background: var(--line);
    }
    .timeline li:last-child:before { display: none; }
    .tl-dot {
      width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--seal);
      background: var(--paper-soft); margin-top: 3px; position: relative; z-index: 1;
    }
    .timeline li.current .tl-dot { background: var(--seal); }
    .timeline li.horizon .tl-dot { border-style: dashed; border-color: var(--muted); }
    .timeline li.done .tl-dot {
      background: var(--ok); border-color: var(--ok);
      display: grid; place-items: center;
    }
    .timeline li.done .tl-dot::after {
      content: "";
      width: 5px; height: 3px;
      border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
      transform: rotate(-45deg) translateY(-0.5px);
    }
    .timeline li.done strong { color: var(--ok); }
    .tl-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
    .timeline strong { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; }
    .timeline p { margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .tl-note { font-size: 12px; color: var(--muted); margin: 4px 0 0; line-height: 1.5; }
    .tl-expand {
      border: 1px dashed var(--line-strong); background: var(--paper-soft); color: var(--seal);
      padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
      width: 100%; text-align: left; margin: 8px 0 4px;
      border-radius: var(--radius-sm);
    }
    .tl-expand:hover { border-color: var(--seal); }
    .co-addr { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .co-lead-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
      margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4;
    }
    .co-lead-row .co-phone { color: var(--ink); letter-spacing: 0.02em; }
    .co-remind {
      border: 1px solid var(--line-strong); background: var(--paper-soft); color: var(--ink);
      padding: 2px 8px; font-size: 11px; cursor: pointer; font-family: inherit;
      border-radius: 999px; line-height: 1.5;
    }
    .co-remind:hover { border-color: var(--seal); color: var(--seal); }
    .co-remind:disabled { opacity: .45; cursor: not-allowed; }
    .hl-amt {
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
      min-width: 72px; flex: none; line-height: 1.1;
    }
    .hl-amt .num {
      font-family: "Noto Serif SC", serif; font-size: 28px; font-weight: 700;
      color: var(--seal); letter-spacing: -0.02em;
    }
    .hl-amt .unit { font-size: 11px; color: var(--seal); opacity: 0.9; margin-top: 1px; }
    .hl-amt .lab { font-size: 10px; color: var(--ink); opacity: 0.72; margin-top: 3px; }
    .hl-amt.inline { align-items: flex-start; margin: 10px 0 6px; }
    .hl-amt.inline .num { font-size: 36px; }
    /* 雷达卡右侧：匹配企业 + 项目金额竖排对齐 */
    .hl-stack {
      display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-start;
      gap: 10px; flex: none; min-width: 88px;
    }
    .hl-stack.inline { align-items: flex-start; gap: 12px; margin: 10px 0 6px; }
    .hl-stack .hl-amt { min-width: 0; }
    /* 项目金额：朱红醒目 */
    .hl-money .num {
      color: var(--accent); /* #8c1d1d */
      font-weight: 700;
    }
    .hl-money .num.short { font-size: 28px; }
    .hl-money .num:not(.short) { font-size: 18px; letter-spacing: -0.01em; }
    .hl-money .lab { color: var(--accent); opacity: 0.8; }
    /* 企业卡：匹配政策条数（朱红，区别于雷达卡的印章绿「家」） */
    .hl-amt.co-pol .num { color: var(--accent); font-size: 32px; }
    .hl-amt.co-pol .unit { color: var(--accent); }
    .co-row > .hl-amt { flex: none; align-self: center; }
    .card-title-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .card-title-row h3 { flex: 1; margin: 0; }
    .card-body-row {
      display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;
      margin-top: 2px;
    }
    .card-body-row > .card-desc { flex: 1; min-width: 0; }
    .card-body-row .cite { margin-top: 4px; }
    .card-plat-row {
      display: flex; gap: 12px; align-items: flex-start;
    }
    .card-plat-row > .card-plat-mid { flex: 1; min-width: 0; }
    .plat-logo {
      width: 44px; height: 44px; border-radius: 10px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; letter-spacing: 0.02em;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
      user-select: none;
      overflow: hidden;
      background: #fff;
    }
    img.plat-logo {
      object-fit: contain;
      padding: 2px;
      font-weight: inherit;
    }
    .pub-time { color: var(--seal); font-weight: 500; font-variant-numeric: tabular-nums; }
    .term-block {
      background: #1a1b1e; color: #e8e6e1; border: 1px solid #2c2e33;
      border-radius: var(--radius);
      padding: 16px 18px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px; line-height: 1.65; overflow-x: auto;
    }
    .term-block .prompt { color: #7dcea0; user-select: none; }
    .term-block .cmd { color: #f0eee8; }
    .term-block .hint-line { color: #8a8f98; margin-top: 10px; display: block; }
    .skills-note {
      margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.6;
    }
    .skills-note code {
      background: #f3f0ea; padding: 1px 6px; font-size: 11px;
    }
    .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.55; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .filters-stack { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .filters-label {
      font-size: 11px; letter-spacing: 0.04em; color: var(--muted);
      margin-right: 4px; align-self: center; white-space: nowrap;
    }
    .chip {
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
      border-radius: 999px;
      transition: background var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease), transform var(--ease);
    }
    .chip:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
    .chip.on { border-color: var(--seal); color: var(--seal); background: #eef6f2; box-shadow: var(--shadow-sm); }
    .stats {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--line); background: var(--paper);
      padding: 10px 14px; min-width: 88px;
      border-radius: var(--radius);
    }
    .stat b {
      display: block; font-family: "Noto Serif SC", serif;
      font-size: 20px; font-weight: 600; color: var(--seal);
    }
    .stat span { font-size: 11px; color: var(--muted); }
    .list { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
    .card {
      border: 1px solid var(--line); padding: 14px 14px; cursor: pointer;
      background: var(--paper);
      transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      animation: cardIn 220ms ease both;
    }
    .card:nth-child(1) { animation-delay: 0ms; }
    .card:nth-child(2) { animation-delay: 30ms; }
    .card:nth-child(3) { animation-delay: 60ms; }
    .card:nth-child(4) { animation-delay: 90ms; }
    .card:nth-child(5) { animation-delay: 120ms; }
    .card:nth-child(6) { animation-delay: 150ms; }
    .card:hover {
      background: #fffdf9;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--line-strong);
    }
    .card.active {
      background: #eef6f2;
      border-color: #b7d4c6;
      box-shadow: 0 2px 10px rgba(15, 111, 79, 0.08);
      transform: none;
    }
    .card h3 {
      margin: 0 0 6px; font-size: 15px; font-weight: 650;
      font-family: "Noto Serif SC", serif; letter-spacing: 0.03em; color: var(--ink);
    }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--ink); align-items: center; }
    .cite { margin-top: 8px; font-size: 12px; color: var(--ink); line-height: 1.55; opacity: 0.88; }
    .cite.event-time { opacity: 0.72; font-size: 11px; }
    .gap { margin-top: 8px; font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: var(--radius-sm); }
    .dual-box {
      margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line);
      background: #fafcfa; font-size: 12px; line-height: 1.55; color: var(--ink);
      border-radius: var(--radius-sm);
    }
    .dual-box strong { color: var(--seal); font-weight: 600; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 8px;
      border: 1px solid var(--line); letter-spacing: 0.04em;
      border-radius: 999px;
    }
    .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: #c5dbc9; }
    .badge.warn { color: var(--warn); background: var(--warn-bg); border-color: #e6d5b0; }
    .badge.bad { color: var(--bad); background: var(--bad-bg); border-color: #e4c4c4; }
    .badge.muted { color: var(--muted); background: #f5f3ee; }
    .badge.seal { color: var(--seal); background: #eef6f2; border-color: #b7d4c6; }
    .card.expired { opacity: 0.55; }
    .card.expired:hover { opacity: 0.75; }
    .warn-strip {
      border: 1px solid #e6d5b0; background: var(--warn-bg);
      padding: 10px 12px; margin-bottom: 12px;
    }
    .warn-strip .warn-head {
      font-size: 12px; font-weight: 600; color: var(--warn); margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .warn-strip .warn-item {
      display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline;
      padding: 6px 8px; cursor: pointer; border: 1px solid transparent;
      font-size: 12px; color: var(--ink);
    }
    .warn-strip .warn-item:hover { background: #fff; border-color: #e6d5b0; }

    function isCorpView(v) {
      return v === "corp" || CORP_VIEWS.includes(v);
    }

    function defaultUserPerms() {
      // 演示口径：全部用户 actions + skills 满权限（全开）
      const full = () => ({
        actions: PERM_ACTIONS.map((a) => a.id),
        skills: [...SKILL_PLATFORMS],
      });
      return {
        "OP-01": full(),
        "OP-02": full(),
        "CORP-W": full(),
        "CORP-L": full(),
      };
    }



    function normalizeUserPermRow(raw, fallback) {
      const base = fallback || { actions: [], skills: [] };
      if (!raw || typeof raw !== "object") {
        return { actions: [...(base.actions || [])], skills: [...(base.skills || [])] };
      }
      if (Array.isArray(raw.actions) || Array.isArray(raw.skills)) {
        return {
          actions: Array.isArray(raw.actions) ? [...raw.actions] : [...(base.actions || [])],
          skills: Array.isArray(raw.skills) ? [...raw.skills] : [...(base.skills || [])],
        };
      }
      // 兼容旧 skillPerms：{ "千问办公": true, ... }
      const skills = SKILL_PLATFORMS.filter((p) => raw[p] !== false && !!raw[p]);
      return {
        actions: [...(base.actions || [])],
        skills: skills.length ? skills : [...(base.skills || [])],
      };
    }

    function migrateLegacySkillPerms(legacy) {
      const defaults = defaultUserPerms();
      const next = {};
      PERM_USERS.forEach((u) => {
        next[u.id] = normalizeUserPermRow(legacy && legacy[u.id], defaults[u.id]);
      });
      return next;
    }

    function loadUserPerms() {
      const defaults = defaultUserPerms();
      try {
        // 演示准备：一次性把旧/残缺授权升为满权限（之后本机勾选可持久）
        const seeded = localStorage.getItem(USER_PERMS_DEMO_FULL_SEED) === "1";
        if (!seeded) {
          saveUserPerms(defaults);
          try { localStorage.setItem(USER_PERMS_DEMO_FULL_SEED, "1"); } catch (_) { /* ignore */ }
          return defaults;
        }
        const raw = localStorage.getItem(USER_PERMS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            const out = {};
            let incomplete = false;
            PERM_USERS.forEach((u) => {
              if (!parsed[u.id]) incomplete = true;
              out[u.id] = normalizeUserPermRow(parsed[u.id], defaults[u.id]);
              if (!Array.isArray(out[u.id].actions) || !Array.isArray(out[u.id].skills)) incomplete = true;
            });
            if (incomplete) {
              saveUserPerms(defaults);
              return defaults;
            }
            return out;
          }
        }
        const legacyRaw = localStorage.getItem(LEGACY_SKILL_PERMS_KEY);
        if (legacyRaw) {
          const legacy = JSON.parse(legacyRaw);
          if (legacy && typeof legacy === "object") {
            const migrated = migrateLegacySkillPerms(legacy);
            saveUserPerms(migrated);
            return migrated;
          }
        }
      } catch (_) { /* ignore */ }
      saveUserPerms(defaults);
      return defaults;
    }

    function saveUserPerms(map) {
      try { localStorage.setItem(USER_PERMS_KEY, JSON.stringify(map || {})); } catch (_) { /* ignore */ }
    }

    function hasSkillPerm(userId, skill) {
      const map = loadUserPerms();
      const row = map[userId];
      if (!row || !Array.isArray(row.skills)) return true;
      return row.skills.includes(skill);
    }

    function hasActionPerm(userId, actionId) {
      const map = loadUserPerms();
      const row = map[userId];
      if (!row || !Array.isArray(row.actions)) return true;
      return row.actions.includes(actionId);
    }

    /** 极简 markdown→html：##/###、列表 -、**粗体**、段落、链接、引用 */
    function mdInline(s) {
      let t = esc(s);
      t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, label, href) =>
        `<a href="${href}" target="_blank" rel="noopener">${label}</a>`
      );
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return t;
    }

    function mdToHtml(md) {
      const lines = String(md ?? "").replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inUl = false;
      let para = [];
      const flushPara = () => {
        if (!para.length) return;
        out.push(`<p>${mdInline(para.join(" "))}</p>`);
        para = [];
      };
      const closeUl = () => {
        if (!inUl) return;
        out.push("</ul>");
        inUl = false;
      };
      for (const raw of lines) {
        const line = raw.replace(/\s+$/, "");
        if (!line.trim()) {
          flushPara();
          closeUl();
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.+)$/);
        if (h) {
          flushPara();
          closeUl();
          const lvl = h[1].length === 1 ? 2 : h[1].length; // # 也当 h2，跟正文观感一致
          out.push(`<h${lvl}>${mdInline(h[2])}</h${lvl}>`);
          continue;
        }
        const bq = line.match(/^>\s?(.*)$/);
        if (bq) {
          flushPara();
          closeUl();
          out.push(`<blockquote><p>${mdInline(bq[1])}</p></blockquote>`);
          continue;
        }
        const li = line.match(/^[-*]\s+(.+)$/);
        if (li) {
          flushPara();
          if (!inUl) { out.push("<ul>"); inUl = true; }
          out.push(`<li>${mdInline(li[1])}</li>`);
          continue;
        }
        closeUl();
        para.push(line);
      }
      flushPara();
      closeUl();
      return out.join("") || `<p>${esc("（无正文）")}</p>`;
    }

    function timelineHtml(events) {
      if (!events || !events.length) return `<p class="cite">暂无沿革</p>`;

        if (!s || s === "此后" || s === "当前" || s.startsWith("此后")) return false;

          const da = a.days_left != null ? a.days_left : 1e9;
          const db = b.days_left != null ? b.days_left : 1e9;
          return da - db || (urg[a.urgency] ?? 9) - (urg[b.urgency] ?? 9);
        });
        return list;
      }
      if (radarSort === "newest") {
        list.sort((a, b) => String(b.window_start || b.id).localeCompare(String(a.window_start || a.id)));
        return list;
      }
      // smart
      list.sort((a, b) => {
        const mc = matchCountOf(b) - matchCountOf(a);
        if (mc) return mc;
        const u = (urg[a.urgency] ?? 9) - (urg[b.urgency] ?? 9);
        if (u) return u;
        const dual = (b.dual_benefit ? 1 : 0) - (a.dual_benefit ? 1 : 0);
        if (dual) return dual;
        const ent = (b.helps_enterprise ? 1 : 0) - (a.helps_enterprise ? 1 : 0);
        if (ent) return ent;
        const sc = scopeRank(a) - scopeRank(b);
        if (sc) return sc;
        const da = a.days_left != null ? a.days_left : 1e9;
        const db = b.days_left != null ? b.days_left : 1e9;
        return da - db;
      });
      return list;
    }

    function formatPubRel(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso).slice(0, 16);
      const diff = Date.now() - d.getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins <= 1 ? "刚刚" : `${mins} 分钟前`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天前`;
      if (days < 30) return `${Math.floor(days / 7)} 周前`;
      return String(iso).slice(0, 10);
    }

    async function api(path, opts = {}) {
      if (window.AlphaDB) {
        try {
          const localRes = await window.AlphaDB.handleRequest(path, opts);
          if (localRes !== null) {
            return localRes;
          }
        } catch (err) {
          console.warn("[AlphaDB] Intercept error, trying fallback:", err);
        }
      }
      const urlParams = new URLSearchParams(window.location.search);
      const studioToken = urlParams.get("studio_token");
      let url = (API || "") + path;
      if (studioToken && !url.includes("studio_token=")) {
        url += (url.includes("?") ? "&" : "?") + "studio_token=" + encodeURIComponent(studioToken);
      }
      const finalOpts = { ...opts };
      finalOpts.headers = { ...(finalOpts.headers || {}) };
      if (studioToken) {
        finalOpts.headers["X-Studio-Token"] = studioToken;
      }
      const res = await fetch(url, finalOpts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    /** 企业端匹配政策卡：内容 / 提效 / 功能三列 + 次要 SOP。 */
    function corpMatchContentMetric(m) {
      const r = (m && m.radar) || {};
      const hard = r.hard_criteria || [];
      const gapBits = String(m.gap || "").split(/[；;、，,]/).map((s) => s.trim()).filter(Boolean);
      let n = hard.length;
      let lab = "门槛要点";
      let sub = hard[0] ? String(hard[0]) : "";
      if (!n && gapBits.length) {
        n = gapBits.length;
        lab = "待补材料";
        sub = gapBits.slice(0, 2).join(" · ");
      }
      if (!n) {
        const cite = String(m.citation || r.value_one_liner || "").trim();
        const parts = cite.split(/[；;。]/).map((s) => s.trim()).filter((s) => s.length > 4);
        n = Math.max(parts.length, cite ? 1 : 0);
        lab = "政策要点";
        sub = parts[0] || cite.slice(0, 36);
      }
      return { num: String(n || "—"), lab, sub: sub.slice(0, 40) };
    }

    function corpMatchEffMetric(m) {
      const r = (m && m.radar) || {};
      const amount = String(r.amount_label || "").trim();
      const benefit = matchBenefitOneLiner(m);
      let days = r.days_left;
      if (days == null && r.window_end) {
        const end = new Date(String(r.window_end).slice(0, 10) + "T00:00:00");
        if (!Number.isNaN(end.getTime())) {
          days = Math.ceil((end - new Date()) / 86400000);
        }
      }
      let num = amount || "";
      let lab = amount ? "额度/口径" : "提效收益";
      let sub = benefit;
      if (!num && days != null && days >= 0) {
        num = `剩 ${days} 天`;
        lab = "申报窗口";
      }
      if (!num && benefit) {
        const mPct = benefit.match(/(\d+\s*%|\d+\s*万|\d+\s*年|\d+\s*天)/);
        num = mPct ? mPct[1].replace(/\s+/g, "") : benefit.slice(0, 10);
        lab = "提效收益";
      }
      if (!num) { num = "—"; lab = "提效收益"; }
      const compact = num.length > 6;
      return { num, lab, sub: String(sub || "").slice(0, 48), compact };
    }

        corpPayload = await api(`/api/corp_home?company_id=${encodeURIComponent(id)}`);

        const match = await api(`/api/policy_match?company_id=${encodeURIComponent(id)}`);

        if (match && match.company) {

          match.company.phone = match.company.phone || co.phone || co.contact_phone || "";

      // 兜底：旧 API 缺 events / services 时，从 matches 按 channel 拆
      if (corpPayload) {
        const needEvents = !Array.isArray(corpPayload.events);
        const needServices = !Array.isArray(corpPayload.services);
        if (needEvents || needServices) {
          const all = corpPayload.matches || [];
          const policies = [];
          const events = needEvents ? [] : corpPayload.events;
          const services = needServices ? [] : corpPayload.services;
          const seenSvc = new Set((services || []).map((s) => s.radar_id || (s.radar && s.radar.id)).filter(Boolean));
          all.forEach((m) => {
            const r = m.radar || (radarItems || []).find((x) => x.id === ((m.radar && m.radar.id) || "")) || {};
            const ch = r.channel || (m.radar && m.radar.channel) || "";

              if (needEvents) {
                events.push({
                  id: m.id,
                  match_id: m.id,
                  radar_id: (m.radar && m.radar.id) || r.id || "",
                  title: (m.radar && m.radar.title) || r.title || "",
                  event_start: r.event_start || r.window_start || "",
                  event_end: r.event_end || r.window_end || "",
                  value_one_liner: r.value_one_liner || (m.radar && m.radar.enterprise_help) || m.citation || "",
                  channel: "公开活动",
                  radar: m.radar || r,
                });
              } else {
                policies.push(m);
              }
            } else if (CORP_SERVICE_CHANNELS.includes(ch)) {
              if (needServices) {
                const rid = (m.radar && m.radar.id) || r.id || "";
                if (!rid || seenSvc.has(rid)) return;
                seenSvc.add(rid);
                services.push({
                  id: m.id,
                  match_id: m.id,
                  radar_id: rid,
                  title: (m.radar && m.radar.title) || r.title || "",
                  channel: ch,
                  source_label: r.doc_no || r.agency || "",
                  value_one_liner: r.value_one_liner || r.benefit_one_liner || r.enterprise_help || m.citation || "",
                  citation: m.citation || "",
                  group: ch === "平台规则活动" ? "平台规则" : "服务",
                  radar: m.radar || r,
                });
              } else {
                policies.push(m);
              }
            } else {
              policies.push(m);
            }
          });
          if (needEvents) corpPayload.events = events;
          if (needServices) corpPayload.services = services;
          if (needEvents || needServices) corpPayload.matches = policies;
        }
      }
      return corpPayload;

    function policyOfficialUrl(item, bodyText) {
      const direct = (item && (item.source_url || (item.source && item.source.url))) || "";
      if (direct) return direct;
      const m = String(bodyText || "").match(/https?:\/\/[^\s)）\]>"']+/);

    }

    function normTitleKey(s) {
      return String(s || "").replace(/\s+/g, "").replace(/[（(].*?[）)]/g, "").trim().toLowerCase();
    }

    /** 去掉与弹窗头重复的首行 #/## 标题；灰盒出处行去掉裸 URL，保留短说明。 */
    function scrubPolicyBodyMd(md, title) {
      let text = String(md ?? "").replace(/\r\n/g, "\n");
      const lines = text.split("\n");
      let i = 0;
      while (i < lines.length && !String(lines[i]).trim()) i++;
      if (i < lines.length) {
        const hm = String(lines[i]).match(/^#{1,2}\s+(.+)$/);
        if (hm && title) {
          const head = hm[1].trim();
          if (head === String(title).trim() || normTitleKey(head) === normTitleKey(title)) {
            lines.splice(i, 1);
            while (i < lines.length && !String(lines[i]).trim()) lines.splice(i, 1);
          }
        }
      }
      text = lines.join("\n");
      text = text.replace(
        /(>?\s*)([^>\n]*?)(官方出处|栏目入口)[：:]\s*https?:\/\/[^\s)）\]>"']+/g,
        (_, prefix, before) => {
          const note = String(before || "").trim().replace(/[。．.]+$/, "");
          const short = note || "摘录样例，非正式全文";
          return `${prefix}${short}。`;
        }
      );
      text = text.replace(/(官方出处|栏目入口)[：:]\s*https?:\/\/[^\s)）\]>"']+/g, "");
      text = text.replace(/([。．])\s*[。．]+/g, "$1");
      return text.trim();
    }

    function resolveModalFocusMatch(matches) {
      const list = matches || [];
      if (!list.length) {
        modalFocusCompanyId = null;
        return null;
      }
      if (portalMode === "corp" && portalCompanyId) {
        const pinned = list.find((m) => m.company_id === portalCompanyId);
        if (pinned) {
          modalFocusCompanyId = portalCompanyId;
          return pinned;
        }
      }
      if (!modalFocusCompanyId || !list.some((m) => m.company_id === modalFocusCompanyId)) {
        modalFocusCompanyId = list[0].company_id;
      }
      return list.find((m) => m.company_id === modalFocusCompanyId) || list[0];
    }

    function whySuitableLines(matches) {
      const lines = (matches || []).slice(0, 3).map((m) => {
        const name = companyLabel(m) || m.company_code || "";
        const band = SIZE_LABELS[m.size_band] || m.headcount_range || "";
        const dir = m.direction || "";
        const scene = m.scene || "";
        const bits = [dir, band].filter(Boolean).join(" · ");
        if (scene) return `${name}${bits ? `（${bits}）` : ""}：${scene}`;
        if (bits) return `${name}：${bits}`;
        return name ? `${name}进入初筛匹配。` : "";
      }).filter(Boolean);
      return lines;
    }

    function needDoBullets(item, matches) {
      const gaps = [];
      const seen = new Set();
      (matches || []).forEach((m) => {
        const g = String(m.gap || "").trim();
        if (g && !seen.has(g)) { seen.add(g); gaps.push(g); }
      });
      if (gaps.length) return gaps.slice(0, 3);
      const hard = (item && item.hard_criteria) || [];
      if (hard.length) return hard.slice(0, 3);
      return ["补齐待检字段后申报"];
    }

    function benefitBullets(item) {
      const out = [];
      const seen = new Set();
      const push = (s) => {
        const t = String(s || "").trim();
        if (!t || seen.has(t)) return;
        seen.add(t);
        out.push(t);
      };
      const one = matchBenefitOneLiner({ radar: item });
      push(one);
      push(item && item.subsidy_detail);
      push(item && item.enterprise_help);
      return out.slice(0, 2);
    }

        seen.add(t);
        out.push(t);
      };

    function canDoBullets(item, match) {
      const out = [];
      const seen = new Set();
      const push = (s) => {
        const t = String(s || "").trim();
        if (!t || seen.has(t)) return;
        seen.add(t);
        out.push(t);
      };
      const pub = isPublicEvent(item);
      if (match && match.primary_action) push(String(match.primary_action));
      if (match && match.gap) {
        push(pub ? `会前补齐：${match.gap}` : `补材料：${match.gap}`);

        push("按官网窗口完成报名 / 预约");

        if (match && match.state === "符合") push("确认接受匹配并同步参会意向");
      } else {
        if (match && match.state === "符合") push("确认接受 SOP，进入申报辅导");
        else if (match && match.state === "待核验") push("核验待检字段后决定是否申报");
        push("在申报窗口内准备材料并走正式渠道");
      }
      if (!out.length) {
        needDoBullets(item, match ? [match] : []).forEach(push);
      }
      return out.slice(0, 4);
    }

    function criteriaChipHtml(item, match) {
      if (!match) return "";
      const chips = [];
      const state = String(match.state || "");
      const hard = (item && item.hard_criteria) || [];
      const gap = String(match.gap || "").trim();
      if (state === "符合") {
        chips.push(`<span class="pm-chip ok"><span class="pm-chip-mark">✓</span>初筛符合</span>`);
        hard.slice(0, 2).forEach((c) => {
          chips.push(`<span class="pm-chip ok"><span class="pm-chip-mark">✓</span>${esc(String(c).slice(0, 28))}${String(c).length > 28 ? "…" : ""}</span>`);
        });
      } else if (state === "待核验") {
        chips.push(`<span class="pm-chip pend"><span class="pm-chip-mark">!</span>待核验</span>`);
        if (hard.length) {
          chips.push(`<span class="pm-chip ok"><span class="pm-chip-mark">✓</span>部分门槛初筛通过</span>`);
        }
        if (gap) {
          chips.push(`<span class="pm-chip pend"><span class="pm-chip-mark">待补</span>${esc(gap.slice(0, 36))}${gap.length > 36 ? "…" : ""}</span>`);
        }
      } else if (state) {
        chips.push(`<span class="pm-chip pend"><span class="pm-chip-mark">·</span>${esc(state)}</span>`);
        if (gap) chips.push(`<span class="pm-chip pend"><span class="pm-chip-mark">待补</span>${esc(gap.slice(0, 36))}</span>`);
      }
      if (!chips.length) return "";
      return `<div class="pm-chips" aria-label="门槛满足摘要">${chips.join("")}</div>`;
    }

    function sopMiniHtml(match) {
      const steps = (match && match.sop_steps) || [];
      if (!steps.length) return "";
      const cur = match.current ?? match.sop_step ?? 0;
      const nodes = steps.map((s, i) => {
        const st = s.state || (i < cur ? "done" : (i === cur ? "current" : "pending"));
        const cls = st === "done" ? "is-done" : (st === "current" || i === cur ? "is-cur" : "");
        const mark = st === "done" ? "✓" : String((s.index ?? i) + 1);
        const sep = i < steps.length - 1 ? `<span class="pm-step-sep">›</span>` : "";
        return `<span class="pm-step ${cls}"><span class="pm-step-dot">${mark}</span>${esc(s.label || "")}</span>${sep}`;
      }).join("");
      return `<div class="pm-steps" aria-label="SOP 步骤摘要">${nodes}</div>`;
    }

    function policyTimeHint(item) {
      if (!item) return "";
      if (isPublicEvent(item)) {
        const range = eventTimeRange(item);
        return range ? `活动时间 ${range}` : "";
      }
      if (item.urgency === "expired") {
        return item.window_end ? `申报截止 ${item.window_end} · 已过窗` : "窗口已关闭";
      }
      if (item.days_left != null) return `剩 ${item.days_left} 天`;
      if (item.window_end) return `申报截止 ${item.window_end}`;
      return item.window || "";
    }

    async function selectRadar(id) {
      selectedRadar = id;
      policyBodyText = "";
      modalFocusCompanyId = null;
      setBusy(true);
      try {
        await Promise.all([loadRadarMatches(id), loadPolicyBody(id)]);
        render();
      } finally {
        setBusy(false);
      }
    }

    function isPublicEvent(r) {
      return !!(r && (r.channel === "公开活动" || String(r.track || "").includes("公开活动")));
    }

    function isPlatformRule(r) {
      return !!(r && (
        r.channel === "平台规则活动"
        || String(r.track || "").includes("平台规则")
      ));
    }

    function platformSlug(r) {
      if (!r) return "";
      const raw = String(r.platform || "").trim();
      if (!raw) {
        const blob = `${r.title || ""} ${r.agency || ""} ${r.track || ""}`;
        const guess = [
          ["小红书", "xiaohongshu"], ["唯品会", "vip"], ["饿了么", "eleme"],
          ["美团", "meituan"], ["快手", "kuaishou"], ["拼多多", "pdd"],
          ["抖音", "douyin"], ["京东", "jd"], ["淘宝", "taobao"], ["天猫", "taobao"],
          ["阿里云", "aliyun"], ["云谷", "yungu"],
        ];
        for (const [name, slug] of guess) {
          if (blob.includes(name)) return slug;
        }
        return "";
      }
      if (PLATFORM_META[raw]) return raw;
      const zh = {
        "抖音": "douyin", "淘宝": "taobao", "天猫": "taobao", "京东": "jd",
        "拼多多": "pdd", "快手": "kuaishou", "小红书": "xiaohongshu",
        "唯品会": "vip", "美团": "meituan", "饿了么": "eleme",
        "阿里云": "aliyun", "云谷": "yungu",
      };
      return zh[raw] || raw;
    }

    function platformLabel(r) {
      const slug = platformSlug(r);
      if (slug && PLATFORM_META[slug]) return PLATFORM_META[slug].label;
      return String((r && r.platform) || "").trim();
    }

    function platformLogo(platform) {
      const slug = String(platform || "").trim();
      const meta = PLATFORM_META[slug] || {
        label: slug || "平台",
        char: (slug || "平").slice(0, 1),
        bg: "#6b7280",
        fg: "#ffffff",
      };
      const title = esc(meta.label);
      if (meta.logo) {
        const src = meta.logo.startsWith("/") ? meta.logo : `/${meta.logo}`;
        const fb = esc(meta.char || meta.label.slice(0, 1));
        const bg = esc(meta.bg || "#6b7280");
        const fg = esc(meta.fg || "#ffffff");
        return `<img class="plat-logo" src="${esc(src)}" alt="${title}" title="${title}" width="44" height="44" loading="lazy" data-fb="${fb}" data-bg="${bg}" data-fg="${fg}" onerror="platformLogoFallback(this)" />`;
      }
      return `<div class="plat-logo" style="background:${esc(meta.bg)};color:${esc(meta.fg)}" title="${title}" aria-label="${title}">${esc(meta.char)}</div>`;
    }

    function platformLogoFallback(img) {
      if (!img || img.dataset.fbDone) return;
      img.dataset.fbDone = "1";
      const d = document.createElement("div");
      d.className = "plat-logo";
      d.title = img.title || "";
      d.setAttribute("aria-label", img.alt || d.title);
      d.textContent = img.dataset.fb || "?";
      d.style.background = img.dataset.bg || "#6b7280";
      d.style.color = img.dataset.fg || "#ffffff";
      img.replaceWith(d);
    }

    function platformBadgeHtml(r) {
      const lab = platformLabel(r);
      return lab ? `<span class="badge platform">${esc(lab)}</span>` : "";
    }

    function eventTimeRange(r) {
      const a = String(r.event_start || r.window_start || "").slice(0, 10);
      const b = String(r.event_end || r.window_end || "").slice(0, 10);
      if (!a && !b) return "";
      if (a && b && a === b) return a;
      if (a && b) return `${a} ~ ${b}`;
      return a || b;
    }

    function eventTimeLine(r, asHtml) {
      const range = eventTimeRange(r);
      if (!range) return "";
      return asHtml
        ? `<p class="cite event-time"><strong>活动时间</strong>　${esc(range)}</p>`
        : `活动时间：${range}`;
    }

            <div class="dash-stat"><b>${matching}</b><span>${esc(cm.matching_label || "匹配进行中")}</span></div>
            <div class="dash-stat"><b>${touched}</b><span>${esc(cm.touched_label || funLabels.sent || "本季触达")}</span></div>
            <div class="dash-stat"><b>${accepted}</b><span>${esc(cm.accepted_label || funLabels.accepted || "企业接受")}</span></div>
            <div class="dash-stat"><b>${passed}</b><span>${esc(cm.passed_label || funLabels.passed || "已通过")}</span></div>
          </div>
          <p class="dash-growth-hint">读法：匹配进行中 → 触达 / 接受 → 已通过；撬动扶持与培育入库为脱敏样例汇总，回答「带来什么」。${esc(d.demo_note || "")}</p>

              <div class="dash-stat"><b>${todos.pending_accept ?? 0}</b><span>${esc(todoLabels.pending_accept || "待企业接受")}</span></div>

            <h2>SOP 进度分布</h2>

        function renderRadar() {

    function corpPolicyModalHtml(payload, c) {
      if (!selectedRadar) return "";
      const fromEvents = (payload.events || [])
        .map((ev) => ev.radar)
        .find((r) => r && r.id === selectedRadar);
      const item = (radarItems || []).find((x) => x.id === selectedRadar)
        || ((payload.matches || []).map((m) => m.radar).find((r) => r && r.id === selectedRadar))
        || fromEvents
        || (payload.events || []).find((ev) => (ev.radar_id || ev.id) === selectedRadar);
      const modalItem = item && item.title ? item : (item ? {
        id: item.radar_id || item.id,
        title: item.title,
        value_one_liner: item.value_one_liner,
        enterprise_help: item.value_one_liner,
        channel: "公开活动",
        event_start: item.event_start,
        event_end: item.event_end,
      } : null);
      if (!modalItem) return "";
      const modalMatches = (radarMatchItems || []).filter((m) => !portalCompanyId || m.company_id === portalCompanyId);
      const url = policyOfficialUrl(modalItem, policyBodyText);
      const leftBody = buildPolicyModalLeftBody(modalItem, url);
      const rightBody = buildPolicyModalRight(modalItem, modalMatches, {
        showEnterCompany: false,
        logoClickable: false,
        emptyLogos: companyLabel(c) || "本企业",
        whyEmpty: "对照贵司画像初筛匹配。",
      });
      const eventCls = isPublicEvent(modalItem) ? " is-event" : "";
      return `
        <div class="policy-modal-overlay" data-close-modal>
          <div class="policy-modal${eventCls}" role="dialog" aria-modal="true" aria-label="${isPublicEvent(modalItem) ? "活动详情" : "政策详情"}" data-modal-panel>
            <button type="button" class="policy-modal-close" data-close-modal aria-label="关闭">×</button>
            <div class="policy-modal-cols">
              <div class="policy-modal-left">
                ${buildPolicyModalHead(modalItem)}
                ${leftBody}
              </div>
              <div class="policy-modal-right">
                ${rightBody}
              </div>
            </div>
          </div>
        </div>`;
    }

        specialSubsidy,
        policyItems,
        wechatDraft
      };
    }

    function renderAttract() {
      if (!currentAttractResult) {
        currentAttractResult = calculateAttractResult(currentAttract);
      }
      const res = currentAttractResult;
      const opVal = document.getElementById("operator") ? document.getElementById("operator").value : "OP-01";

      const html = `
        <div class="attract-wrap">
          <div class="attract-quick-bar">
            <span>⚡ 现场极速演示预设（点击1秒生成报表）：</span>
            <button class="quick-preset-btn" onclick="window.applyAttractPreset(0)">预设一：20人工业智能体制造团队 (240㎡ / 算力60万)</button>
            <button class="quick-preset-btn" onclick="window.applyAttractPreset(1)">预设二：西湖区 OPC 独立开发者三人组 (工位3个 / 免租金)</button>
            <button class="quick-preset-btn" onclick="window.applyAttractPreset(2)">预设三：具身智能出海硬件企业 (180㎡ / 退税设备贴息)</button>
          </div>

          <div class="attract-main-grid">
            <!-- 左侧：输入要素与AI快速提取 -->
            <div class="attract-form-card">
              <h3>招商企业要素输入</h3>
              
              <div class="attract-form-group">
                <label>一句话自然语言 / 微信聊天记录快速粘贴：</label>
                <textarea id="attr_raw_text" placeholder="粘贴意向企业介绍或微信聊天的需求，AI自动提取要素...">${escapeHtml(currentAttract.raw_text || "")}</textarea>
              </div>

              <div style="text-align:right; margin-bottom:12px;">
                <button type="button" class="btn-secondary" style="width:100%;" onclick="window.parseAttractRawText()">🤖 AI 智能提取意向要素</button>
              </div>

              <div class="attract-form-group">
                <label>意向企业名称 / 简称：</label>
                <input type="text" id="attr_name" value="${escapeHtml(currentAttract.name)}" />
              </div>

              <div class="attract-form-group">
                <label>主营技术赛道：</label>
                <input type="text" id="attr_direction" value="${escapeHtml(currentAttract.direction)}" />
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="attract-form-group">
                  <label>团队规模（人）：</label>
                  <input type="number" id="attr_headcount" value="${currentAttract.headcount}" />
                </div>
                <div class="attract-form-group">
                  <label>拟租赁面积（㎡）：</label>
                  <input type="number" id="attr_area" value="${currentAttract.area}" />
                </div>
              </div>

              <div class="attract-form-group">
                <label>年算力与设备预算（万元）：</label>
                <input type="number" id="attr_compute" value="${currentAttract.compute}" />
              </div>

              <button class="btn-calc" onclick="window.doCalculateAttract()">
                <span>⚡ 重新测算 2026 入园红利总账</span>
              </button>
            </div>

            <!-- 右侧：输出入园政策红利测算报表 -->
            <div class="report-card" id="attract_report_print">
              <div class="report-header">
                <div class="report-title-box">
                  <h2>云谷中心 · 企业入园政策红利与降本测算提案单</h2>
                  <p>公文依据：严格锁定 2026 纯现行国家与省市区权威政策 · 编号：招商〔2026〕Q03号 · 责任专员：${opVal}</p>
                </div>
                <div class="report-badge">官方核验通过 · 责任可追</div>
              </div>

              <!-- 4个核心总账大指标 -->
              <div class="metrics-summary-grid">
                <div class="metric-sub-card highlight">
                  <label>预计首年综合减免总账</label>
                  <div class="val">¥ ${(res.totalBenefit / 10000).toFixed(1)} 万</div>
                  <small>综合降低入园成本约 35%~50%</small>
                </div>
                <div class="metric-sub-card">
                  <label>房租 / 工位减免</label>
                  <div class="val">¥ ${(res.rentSavings / 10000).toFixed(1)} 万</div>
                  <small>OPC免租 / 2元/天·㎡先缴后补</small>
                </div>
                <div class="metric-sub-card">
                  <label>算力券与专项直补</label>
                  <div class="val">¥ ${(res.computeSubsidy / 10000).toFixed(1)} 万</div>
                  <small>工信部209号 / 算力券50%</small>
                </div>
                <div class="metric-sub-card">
                  <label>设备与出海专项贴息</label>
                  <div class="val">¥ ${(res.specialSubsidy / 10000).toFixed(1)} 万</div>
                  <small>特别国债15% / 跨关区退税</small>
                </div>
              </div>

              <!-- 2026 政策三态准入清单 -->
              <div class="report-section-title">2026 现行公文依据与三态准入初筛（符合 · 待核验 · 排除）</div>
              <table class="policy-eval-table">
                <thead>
                  <tr>
                    <th style="width:18%;">政策发文字号</th>
                    <th style="width:25%;">政策全称与官方出处</th>
                    <th style="width:12%;">初筛状态</th>
                    <th style="width:45%;">测算匹配理由与扶持条文</th>
                  </tr>
                </thead>
                <tbody>
                  ${res.policyItems.map(item => `
                    <tr>
                      <td><strong>${escapeHtml(item.doc)}</strong></td>
                      <td>
                        <a href="${item.url}" target="_blank" rel="noopener" style="color:var(--seal); text-decoration:underline;">
                          ${escapeHtml(item.title)}
                        </a>
                      </td>
                      <td><span class="tag-state ${item.stateClass}">${item.state}</span></td>
                      <td>
                        <div style="color:var(--ink); font-weight:500;">${escapeHtml(item.benefit)}</div>
                        <div style="font-size:11px; color:var(--muted); margin-top:2px;">摘录：${escapeHtml(item.clause)}</div>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>

              <!-- 微信触达大白话草稿 -->
              <div class="report-section-title">微信触达大白话草稿（招商经理复制即发给创始人）</div>
              <div class="wechat-draft-box">
                <h4>
                  <span>💬 专属微信谈判沟通草稿（已按 ${opVal} 身份定制）</span>
                  <button type="button" class="btn-secondary" style="padding:3px 8px; font-size:11px;" onclick="window.copyWechatDraft()">📋 一键复制文案</button>
                </h4>
                <p id="wechat_draft_text">${escapeHtml(res.wechatDraft)}</p>
              </div>

              <!-- 签约交接与责任留痕 -->
              <div class="report-actions">
                <button type="button" class="btn-secondary" onclick="window.printReport()">🖨️ 打印测算提案单</button>
                <button type="button" class="btn-primary" onclick="window.doAttractHandover()">🤝 意向签约 · 一键交接转入企服台账（责任留痕）</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("content").innerHTML = html;
      bindAttractEvents();
    }

    function bindAttractEvents() {
      window.applyAttractPreset = function(index) {
        currentAttract = { ...ATTRACT_PRESETS[index] };
        currentAttractResult = calculateAttractResult(currentAttract);
        renderAttract();
        toast("已成功载入预设，测算报表已更新！");
      };

      window.parseAttractRawText = function() {
        const text = (document.getElementById("attr_raw_text").value || "").trim();
        if (!text) {
          toast("请先粘贴企业需求或聊天文本");
          return;
        }
        // AI 意向要素提取逻辑
        let name = "意向企业";
        let direction = "人工智能/智能体研发";
        let headcount = 10;
        let area = 120;
        let compute = 20;

        if (text.includes("机器人") || text.includes("工业") || text.includes("制造")) {
          name = "工业智能体研发团队";
          direction = "人工智能/工业智能体";
          headcount = 20;
          area = 240;
          compute = 60;
        } else if (text.includes("OPC") || text.includes("独立开发") || text.includes("一人")) {
          name = "AI 原生 OPC 团队";
          direction = "一人公司/OPC/智能工具链";
          headcount = 3;
          area = 15;
          compute = 5;
        } else if (text.includes("出海") || text.includes("硬件") || text.includes("跨境")) {
          name = "具身智能出海硬件企业";
          direction = "智能硬件研发/出海跨境";
          headcount = 15;
          area = 180;
          compute = 30;
        }

        const matchHc = text.match(/(\d+)\s*人/);
        if (matchHc) headcount = parseInt(matchHc[1]);
        const matchArea = text.match(/(\d+)\s*(平米|平|㎡)/);
        if (matchArea) area = parseInt(matchArea[1]);
        const matchComp = text.match(/(\d+)\s*(万|万元)/);
        if (matchComp) compute = parseInt(matchComp[1]);

        currentAttract = {
          name,
          direction,
          size_band: headcount <= 3 ? "opc" : (headcount <= 20 ? "s_3_20" : "m_20_100"),
          headcount,
          area,
          compute,
          raw_text: text
        };

        currentAttractResult = calculateAttractResult(currentAttract);
        renderAttract();
        toast("AI 要素提取完成！已生成测算报表。");
      };

      window.doCalculateAttract = function() {
        currentAttract.name = document.getElementById("attr_name").value.trim() || "意向企业";
        currentAttract.direction = document.getElementById("attr_direction").value.trim() || "人工智能";
        currentAttract.headcount = parseInt(document.getElementById("attr_headcount").value) || 10;
        currentAttract.area = parseInt(document.getElementById("attr_area").value) || 100;
        currentAttract.compute = parseInt(document.getElementById("attr_compute").value) || 10;
        currentAttract.size_band = currentAttract.headcount <= 3 ? "opc" : (currentAttract.headcount <= 20 ? "s_3_20" : "m_20_100");

        currentAttractResult = calculateAttractResult(currentAttract);
        renderAttract();
        toast("入园红利测算报表已实时更新！");
      };

      window.copyWechatDraft = function() {
        const text = document.getElementById("wechat_draft_text").innerText;
        navigator.clipboard.writeText(text).then(() => {
          toast("微信草稿文案已复制到剪贴板！可直接发送给企业创始人");
        }).catch(() => {
          toast("复制成功！请直接在聊天框粘贴");
        });
      };

      window.printReport = function() {
        window.print();
      };

      window.doAttractHandover = async function() {
        setBusy(true);
        try {
          const op = document.getElementById("operator").value;
          const res = await api("/api/attract/handover", {
            method: "POST",
            body: JSON.stringify({
              name: currentAttract.name,
              direction: currentAttract.direction,
              size_band: currentAttract.size_band,
              headcount: currentAttract.headcount,
              area: currentAttract.area,
              operator: op
            })
          });
          toast("🤝 签约交接成功！责任专员留痕完成，已归档至在园企业名册！");
          // 重新拉取并在 1 秒后无缝切换到企业运营视图
          await loadCompanies();
          setTimeout(() => {
            view = "companies";
            syncNav();
            render();
          }, 1200);
        } catch (e) {
          toast("交接保存失败: " + e.message);
        } finally {
          setBusy(false);
        }
      };
    }

    function render() {
      if (view === "dashboard") renderDashboard();
      else if (view === "radar") renderRadar();
      else if (view === "companies") renderCompanies();
      else if (view === "attract") renderAttract();
      else if (view === "skills") renderSkills();
      else if (view === "perms") renderPerms();
      else if (isCorpView(view)) renderCorpPortal();
      else { view = "dashboard"; renderDashboard(); }
    }

    function syncNav() {
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-view") === view);
      });
    }

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.onclick = async () => {
        const next = btn.getAttribute("data-view");
        if (!next) return;
        if (portalMode === "corp") {
          if (!CORP_VIEWS.includes(next)) return;
          view = next;
          corpStaffEditId = null;
          if (view !== "corp_policies" && view !== "corp_events" && view !== "corp_services") {
            selectedRadar = null;
            radarMatchItems = [];
            policyBodyText = "";
          }
          syncNav();
          setBusy(true);
          try {
            await loadCorpHome(portalCompanyId);
            render();
          } finally { setBusy(false); }
          return;
        }
        if (btn.getAttribute("data-portal-nav") === "corp") return;
        if (next === "media" || next === "attract") return;
        view = next;
        lastOpsView = view;
        if (view !== "radar") {
          selectedRadar = null;
          radarMatchItems = [];
          policyBodyText = "";
        }
        syncNav();
        setBusy(true);
        try {
          if (view === "dashboard") await loadDashboard();
          else if (view === "radar") await loadRadar();
          else if (view === "companies") await loadCompanies();
          render();
        } finally { setBusy(false); }
      };
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && selectedRadar && (view === "radar" || isCorpView(view))) {
        e.preventDefault();
        closeRadarModal();
      }
    });

    document.getElementById("operator").addEventListener("change", () => {
      syncOpSeal();
      if (view === "skills") renderSkills();
    });
    syncOpSeal();

    document.querySelectorAll(".portal-btn").forEach((btn) => {
      btn.onclick = () => switchPortal(btn.getAttribute("data-portal"));
    });
    document.getElementById("portalCompany").addEventListener("change", async (e) => {
      portalCompanyId = e.target.value || "";
      localStorage.setItem("portalCompanyId", portalCompanyId);
      corpStaffEditId = null;
      if (portalMode !== "corp") return;
      setBusy(true);
      try {
        await loadCorpHome(portalCompanyId);
        selectedRadar = null;
        radarMatchItems = [];
        policyBodyText = "";
        render();
      } finally { setBusy(false); }
    });

    (async function init() {
      const btnExport = document.getElementById("btnExportDb");
      if (btnExport) {
        btnExport.addEventListener("click", () => {
          if (window.AlphaDB) {
            window.AlphaDB.exportSqliteDb();
            toast("已触发本地 SQLite 数据库导出");
          }
        });
      }
      const btnReset = document.getElementById("btnResetDb");
      if (btnReset) {
        btnReset.addEventListener("click", () => {
          if (confirm("确定要重置为初始演示数据吗？本地修改的进度将恢复默认。")) {
            if (window.AlphaDB) {
              window.AlphaDB.reset();
              toast("已恢复初始演示底账");
              setTimeout(() => location.reload(), 500);
            }
          }
        });
      }

      try {
        await api("/api/health").catch((e) => console.warn("health check warning:", e));
        await loadDashboard().catch((e) => console.warn("loadDashboard warning:", e));
        await loadRadar().catch((e) => console.warn("loadRadar warning:", e));
        await loadCompanies().catch((e) => console.warn("loadCompanies warning:", e));
        populatePortalCompanySelect();
        applyPortalMode();
        if (portalMode === "corp") {
          view = "corp_policies";
          await loadCorpHome(portalCompanyId);
        } else if (view === "attract" || isCorpView(view)) {
          view = "dashboard";
        }
        render();
        setApiStatus("");
      } catch (e) {
        console.error("Init render error:", e);
        setApiStatus("数据异常", true);
        document.getElementById("content").innerHTML =
          `<div class="empty">工作台载入异常: ${escapeHtml(e.message || "未知错误")}<br/>请检查接口连接或刷新重试</div>`;
      }
    })();
  </script>
</body>
</html>
