<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云谷企服运营台</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
  </style>
  <style>
    :root {
      --bg: #f7f5f0;
      --paper: #ffffff;
      --ink: #1c1c1c;
      --muted: #6b6b6b;
      --line: #e6e1d8;
      --line-strong: #cfc7ba;
      --accent: #8c1d1d;
      --accent-soft: #f3e8e6;
      --ok: #2f5d3a;
      --ok-bg: #eef5f0;
      --warn: #8a5a12;
      --warn-bg: #f7f0e4;
      --bad: #8c1d1d;
      --bad-bg: #f7ecec;
      --seal: #0f6f4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 100% 0%, rgba(15, 111, 79, 0.04), transparent 55%),
        linear-gradient(180deg, #faf8f4 0%, var(--bg) 40%, #f3f0ea 100%);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .app { display: flex; flex: 1; min-height: 0; }
    .side {
      width: 228px;
      background: var(--paper);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      gap: 4px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    .logo {
      width: 40px; height: 40px;
      border: 1.5px solid var(--seal);
      color: var(--seal);
      background: #fff;
      display: grid; place-items: center;
      font-family: "Noto Serif SC", serif;
      font-weight: 700; font-size: 13px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .brand h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .brand p { margin: 4px 0 0; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
    .nav-btn {
      text-align: left;
      border: none;
      border-left: 2px solid transparent;
      background: transparent;
      color: var(--ink);
      padding: 11px 12px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.35;
    }
    .nav-btn:hover { background: #faf8f4; }
    .nav-btn.active {
      border-left-color: var(--seal);
      background: #f3f8f5;
      color: var(--seal);
      font-weight: 600;
    }
    .nav-btn small { display: block; color: var(--muted); margin-top: 3px; font-size: 11px; font-weight: 400; }
    .side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .side-foot select {
      width: 100%; margin-top: 8px; padding: 8px 10px;
      border: 1px solid var(--line); background: #fff; font-family: inherit; font-size: 12px;
    }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .topbar {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 14px 22px; border-bottom: 1px solid var(--line);
      font-size: 12px; color: var(--muted); background: rgba(255,255,255,.55);
    }
    .topbar strong { color: var(--ink); font-weight: 500; }
    .content { flex: 1; overflow: auto; padding: 18px 22px 28px; }
    textarea, .form-grid input, .form-grid select, .form-grid textarea {
      flex: 1; border: 1px solid var(--line); background: #fff;
      font-family: inherit; font-size: 13px; padding: 10px 12px; resize: vertical;
      width: 100%;
    }
    .draft-inline {
      margin-top: 10px; padding: 12px; border: 1px solid var(--line);
      background: #fafcfa;
    }
    .draft-inline label {
      display: block; font-size: 11px; color: var(--muted);
      margin-bottom: 6px; letter-spacing: 0.06em;
    }
    .draft-inline pre {
      margin: 0 0 10px; white-space: pre-wrap; word-break: break-word;
      font-family: inherit; font-size: 13px; line-height: 1.55; color: var(--ink);
    }
    .skills-hero {
      max-width: 720px; margin: 8px auto 0;
    }
    .skills-hero h2 {
      margin: 0 0 8px; font-family: "Noto Serif SC", serif;
      font-size: 26px; font-weight: 600; letter-spacing: 0.04em;
    }
    .skills-hero .lead {
      margin: 0 0 18px; font-size: 14px; color: var(--muted); line-height: 1.6;
    }
    .platform-pills {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }
    .platform-pill {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      padding: 7px 12px 7px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .platform-pill svg { width: 16px; height: 16px; flex: none; display: block; }
    .platform-pill.on {
      border-color: var(--seal); color: var(--seal); background: #f3f8f5; font-weight: 600;
    }
    .dash-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 0 0 14px;
    }
    .dash-tab {
      border: none; border-bottom: 2px solid transparent; background: transparent;
      color: var(--muted); padding: 8px 16px 10px; margin-bottom: -1px;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .dash-tab.on { color: var(--seal); border-bottom-color: var(--seal); font-weight: 600; }
    .source-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .source-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      padding: 3px 8px; font-size: 12px; text-decoration: none;
    }
    .source-chip svg { width: 14px; height: 14px; flex: none; display: block; }
    .source-chip.sample { color: var(--muted); background: #f6f4ef; }
    .stage-path { margin-top: 6px; font-size: 12px; color: var(--seal); letter-spacing: 0.03em; }
    .timeline { list-style: none; margin: 8px 0 0; padding: 0; }
    .timeline li {
      display: grid; grid-template-columns: 14px 1fr; gap: 10px;
      position: relative; padding-bottom: 12px;
    }
    .timeline li:before {
      content: ""; position: absolute; left: 6px; top: 10px; bottom: 0; width: 1px; background: var(--line);
    }
    .timeline li:last-child:before { display: none; }
    .tl-dot {
      width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--seal);
      background: #fff; margin-top: 4px; position: relative; z-index: 1;
    }
    .timeline li.current .tl-dot { background: var(--seal); }
    .timeline li.horizon .tl-dot { border-style: dashed; border-color: var(--muted); }
    .tl-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
    .timeline strong { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; }
    .timeline p { margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .tl-note { font-size: 12px; color: var(--muted); margin: 4px 0 0; line-height: 1.5; }
    .tl-expand {
      border: 1px dashed var(--line-strong); background: #faf8f4; color: var(--seal);
      padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
      width: 100%; text-align: left; margin: 8px 0 4px;
    }
    .tl-expand:hover { border-color: var(--seal); }
    .co-addr { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .hl-amt {
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
      min-width: 88px; flex: none; line-height: 1.1;
    }
    .hl-amt .num {
      font-family: "Noto Serif SC", serif; font-size: 28px; font-weight: 700;
      color: var(--seal); letter-spacing: -0.02em;
    }
    .hl-amt .unit { font-size: 11px; color: var(--seal); opacity: 0.85; margin-top: 2px; }
    .hl-amt .lab { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .hl-amt.inline { align-items: flex-start; margin: 10px 0 6px; }
    .hl-amt.inline .num { font-size: 36px; }
    .card-title-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .card-title-row h3 { flex: 1; margin: 0; }
    .card-body-row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .card-body-row .cite { flex: 1; }
    .pub-time { color: var(--seal); font-weight: 500; font-variant-numeric: tabular-nums; }
    .card { box-shadow: inset 3px 0 0 #e7e1d6; }
    .term-block {
      background: #1a1b1e; color: #e8e6e1; border: 1px solid #2c2e33;
      padding: 16px 18px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px; line-height: 1.65; overflow-x: auto;
    }
    .term-block .prompt { color: #7dcea0; user-select: none; }
    .term-block .cmd { color: #f0eee8; }
    .term-block .hint-line { color: #8a8f98; margin-top: 10px; display: block; }
    .skills-note {
      margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.6;
    }
    .skills-note code {
      background: #f3f0ea; padding: 1px 6px; font-size: 11px;
    }
    .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.55; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .chip.on { border-color: var(--seal); color: var(--seal); background: #f3f8f5; }
    .stats {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--line); background: var(--paper);
      padding: 10px 14px; min-width: 88px;
    }
    .stat b {
      display: block; font-family: "Noto Serif SC", serif;
      font-size: 20px; font-weight: 600; color: var(--seal);
    }
    .stat span { font-size: 11px; color: var(--muted); }
    .list { display: flex; flex-direction: column; gap: 0; }
    .card {
      border-bottom: 1px solid var(--line); padding: 14px 14px; cursor: pointer;
      background: transparent; transition: background .15s;
    }
    .card:hover { background: #faf8f4; }
    .card.active { background: #f3f8f5; border-left: 2px solid var(--seal); }
    .card h3 {
      margin: 0 0 6px; font-size: 14px; font-weight: 600;
      font-family: "Noto Serif SC", serif; letter-spacing: 0.03em;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--muted); align-items: center; }
    .cite { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.55; }
    .gap { margin-top: 8px; font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 8px 10px; }
    .dual-box {
      margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line);
      background: #fafcfa; font-size: 12px; line-height: 1.55; color: var(--ink);
    }
    .dual-box strong { color: var(--seal); font-weight: 600; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 7px;
      border: 1px solid var(--line); letter-spacing: 0.04em;
    }
    .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: #c5dbc9; }
    .badge.warn { color: var(--warn); background: var(--warn-bg); border-color: #e6d5b0; }
    .badge.bad { color: var(--bad); background: var(--bad-bg); border-color: #e4c4c4; }
    .badge.muted { color: var(--muted); background: #f5f3ee; }
    .badge.seal { color: var(--seal); background: #eef6f2; border-color: #b7d4c6; }
    .card.expired { opacity: 0.55; }
    .card.expired:hover { opacity: 0.75; }
    .card-title-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .card-title-row h3 { flex: 1; margin: 0; }
    .warn-strip {
      border: 1px solid #e6d5b0; background: var(--warn-bg);
      padding: 10px 12px; margin-bottom: 12px;
    }
    .warn-strip .warn-head {
      font-size: 12px; font-weight: 600; color: var(--warn); margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .warn-strip .warn-item {
      display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline;
      padding: 6px 8px; cursor: pointer; border: 1px solid transparent;
      font-size: 12px; color: var(--ink);
    }
    .warn-strip .warn-item:hover { background: #fff; border-color: #e6d5b0; }
    .warn-strip .warn-item .days { color: var(--warn); font-weight: 600; }
    .warn-strip .warn-item .doc { color: var(--muted); }
    .split { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; align-items: start; }
    .split.radar-layout { grid-template-columns: minmax(0, 1fr) minmax(180px, 240px); }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; }
      .split.radar-layout { grid-template-columns: 1fr; }
    }
    .split-list { border: 1px solid var(--line); background: var(--paper); max-height: calc(100vh - 300px); overflow: auto; }
    .split-detail { min-height: 200px; border: 1px solid var(--line); background: var(--paper); padding: 16px 18px; }
    .policy-modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(28, 28, 28, 0.28);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; backdrop-filter: blur(2px);
    }
    .policy-modal {
      position: relative; width: min(1080px, 100%);
      max-height: min(88vh, 820px);
      background: #fff; border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(28, 28, 28, 0.12);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .policy-modal-close {
      position: absolute; top: 10px; right: 12px; z-index: 2;
      border: none; background: transparent; color: var(--muted);
      font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px;
      font-family: inherit;
    }
    .policy-modal-close:hover { color: var(--ink); }
    .policy-modal-cols {
      display: grid; grid-template-columns: 1.15fr 0.85fr;
      min-height: 0; flex: 1; overflow: hidden;
    }
    @media (max-width: 820px) {
      .policy-modal-cols { grid-template-columns: 1fr; overflow: auto; }
    }
    .policy-modal-left, .policy-modal-right {
      padding: 22px 24px; min-height: 0; overflow: auto;
    }
    .policy-modal-left {
      border-right: 1px solid var(--line); background: #fff;
    }
    .policy-modal-right { background: #faf9f6; display: flex; flex-direction: column; gap: 14px; }
    .pm-head h2 {
      margin: 0 0 6px; padding-right: 28px;
      font-size: 16px; font-family: "Noto Serif SC", serif; font-weight: 600; line-height: 1.4;
    }
    .pm-doc { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 14px; }
    .policy-modal-left .policy-body {
      margin-top: 0; max-height: none; border: none; background: transparent; padding: 0;
    }
    .pm-logos {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding-bottom: 4px; border-bottom: 1px solid var(--line);
    }
    .pm-logo-btn {
      display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
      border: none; background: transparent; cursor: pointer; padding: 0;
      font-family: inherit; color: var(--ink); max-width: 64px;
    }
    .pm-logo-btn .co-avatar { width: 40px; height: 40px; }
    .pm-logo-btn span {
      font-size: 10px; color: var(--muted); line-height: 1.2;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 64px;
    }
    .pm-logo-btn:hover span { color: var(--seal); }
    .pm-sec { margin: 0; }
    .pm-sec h3 {
      margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--seal);
      letter-spacing: 0.06em; font-family: inherit;
    }
    .pm-sec p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink); }
    .pm-sec ul {
      margin: 0; padding-left: 1.15em; font-size: 13px; line-height: 1.55; color: var(--ink);
    }
    .pm-sec li { margin: 3px 0; }
    .pm-foot {
      margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line);
    }
    .pm-foot .pm-time { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
    .pm-empty-logos { font-size: 12px; color: var(--muted); }
    .detail h2 {
      margin: 0 0 8px; font-size: 17px; font-family: "Noto Serif SC", serif; font-weight: 600;
    }
    .empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .act {
      border: 1px solid var(--line-strong); background: #fff; color: var(--ink);
      padding: 8px 14px; font-size: 12px; cursor: pointer; font-family: inherit;
      border-radius: 8px;
    }
    .act:hover { border-color: var(--seal); color: var(--seal); }
    .act.primary { background: var(--seal); color: #fff; border-color: var(--seal); }
    .act.primary:hover { background: #0c5c42; }
    .act:disabled { opacity: .4; cursor: not-allowed; }
    .match { border-top: 1px solid var(--line); padding: 14px 0; }
    .sop-track {
      margin-top: 12px;
      padding: 12px 14px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #faf8f4 0%, #f5f2eb 100%);
    }
    .sop-nodes {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0; position: relative;
    }
    .sop-node {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 1; min-width: 0;
    }
    .sop-node:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 11px; left: calc(50% + 12px); right: calc(-50% + 12px);
      height: 2px; background: var(--line-strong);
      z-index: 0;
    }
    .sop-node.done:not(:last-child)::after,
    .sop-node.current:not(:last-child)::after { background: #9bbfae; }
    .sop-dot {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--line-strong); background: #fff;
      display: grid; place-items: center;
      font-size: 11px; color: var(--muted); font-weight: 600;
      position: relative; z-index: 1;
    }
    .sop-node.done .sop-dot {
      border-color: var(--seal); background: var(--seal); color: #fff;
    }
    .sop-node.current .sop-dot {
      border-color: var(--seal); background: #fff; color: var(--seal);
      box-shadow: 0 0 0 3px rgba(15, 111, 79, 0.12);
    }
    .sop-node.pending .sop-dot { opacity: 0.55; }
    .sop-node.rejected .sop-dot {
      border-color: var(--bad); background: var(--bad); color: #fff;
    }
    .sop-lab {
      margin-top: 6px; font-size: 11px; color: var(--muted);
      text-align: center; line-height: 1.25; letter-spacing: 0.02em;
      max-width: 4.5em;
    }
    .sop-node.done .sop-lab { color: var(--ok); }
    .sop-node.current .sop-lab { color: var(--seal); font-weight: 600; }
    .sop-node.rejected .sop-lab { color: var(--bad); font-weight: 600; }
    .sop-actions { margin-top: 10px; }
    .bars { margin: 12px 0; }
    .bar-row { display: grid; grid-template-columns: 48px 1fr 36px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 6px; color: var(--muted); }
    .bar-track { height: 6px; background: #eee9e0; }
    .bar-fill { height: 100%; background: var(--seal); }
    .form-grid { display: grid; gap: 10px; margin-top: 8px; }
    .form-grid label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .toast {
      position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: var(--ink); color: #fff; padding: 8px 14px; font-size: 12px;
      opacity: 0; pointer-events: none; transition: .25s ease; z-index: 50; letter-spacing: 0.04em;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .op-seal {
      position: fixed; right: 22px; bottom: 22px; z-index: 40;
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--seal); background: #fff; color: var(--seal);
      display: grid; place-items: center;
      font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 15px;
      box-shadow: 0 2px 10px rgba(15, 111, 79, 0.12);
      cursor: default; user-select: none;
    }
    .op-seal:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
    .topbar:empty, .topbar:has(> :empty:only-child) { display: none; }
    .topbar.quiet { display: none; }
    .topbar.warn {
      display: flex; justify-content: flex-end;
      padding: 10px 22px; border-bottom: 1px solid #e6d5b0;
      font-size: 12px; color: var(--warn); background: var(--warn-bg);
    }
    .busy { opacity: .55; pointer-events: none; }
    .size-tag { font-family: "Noto Serif SC", serif; letter-spacing: 0.06em; }
    .co-row { display: flex; align-items: flex-start; gap: 12px; }
    .co-row > div { min-width: 0; flex: 1; }
    .co-avatar {
      width: 40px; height: 40px; flex: none;
      border-radius: 8px; object-fit: cover;
      border: 1px solid var(--line); background: #fff;
      display: block;
    }
    .co-avatar.fallback {
      display: grid; place-items: center;
      font-family: "Noto Serif SC", serif; font-weight: 600;
      font-size: 15px; color: var(--seal); background: #f3f8f5;
    }
    .co-avatar.lg { width: 52px; height: 52px; border-radius: 10px; }
    .detail-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
    .detail-head h2 { margin: 0; }
    .code-pill { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
    .filter-row .lbl { font-size: 11px; color: var(--muted); margin-right: 2px; letter-spacing: 0.06em; }
    .policy-body {
      margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line);
      background: #faf9f6; font-size: 13px; line-height: 1.7;
      max-height: 320px; overflow: auto;
      font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
    }
    .policy-body h2, .policy-body h3 {
      margin: 14px 0 6px; font-family: "Noto Serif SC", serif; font-weight: 600;
      line-height: 1.35; color: var(--ink);
    }
    .policy-body h2 { font-size: 15px; }
    .policy-body h3 { font-size: 14px; }
    .policy-body h2:first-child, .policy-body h3:first-child { margin-top: 0; }
    .policy-body p { margin: 0 0 8px; }
    .policy-body ul { margin: 0 0 10px; padding-left: 1.25em; }
    .policy-body li { margin: 2px 0; }
    .policy-body strong { font-weight: 600; }
    .policy-body a { color: var(--seal); text-decoration: underline; text-underline-offset: 2px; }
    .policy-body blockquote {
      margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--line);
      color: var(--muted); background: #f3f1ec;
    }
    .portfolio-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px; margin-top: 8px;
    }
    .portfolio-card { border: 1px solid var(--line); background: #fff; overflow: hidden; }
    .portfolio-cover { height: 56px; }
    .portfolio-card strong { display: block; padding: 8px 10px 0; font-size: 13px; }
    .portfolio-card p { margin: 4px 10px 10px; font-size: 11px; color: var(--muted); line-height: 1.45; }
    .team-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .team-chip { border: 1px solid var(--line); background: #faf8f4; padding: 6px 10px; font-size: 12px; }
    .team-chip b { display: block; font-size: 12px; color: var(--seal); }
    .match-row {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line);
    }
    .match-row .left { flex: 1; min-width: 140px; }

    .media-banner {
      margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--line);
      background: #f7f0e4; color: var(--warn); font-size: 12px; line-height: 1.55;
    }
    .media-banner.ok {
      background: #eef5f0; color: var(--ok); border-color: #c5dbc9;
    }
    .media-banner code {
      background: rgba(0,0,0,.05); padding: 1px 5px; font-size: 11px;
    }
    .media-sources {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
      font-size: 11px; color: var(--muted);
    }
    .media-sources span {
      border: 1px solid var(--line); padding: 3px 8px; background: #fff;
    }
    .media-sources span.on { color: var(--ok); border-color: #c5dbc9; background: #eef5f0; }
    .media-sources span.off { color: var(--warn); background: #f7f0e4; }
    .media-card-row { display: flex; gap: 12px; align-items: flex-start; }
    .media-thumb {
      width: 96px; height: 72px; flex: none; object-fit: cover;
      border: 1px solid var(--line); background: #f3f0ea;
    }
    .media-thumb.ph {
      display: grid; place-items: center; font-size: 11px; color: var(--muted);
    }
    .media-detail-media {
      margin: 12px 0; border: 1px solid var(--line); background: #faf8f4;
      overflow: hidden; max-width: 100%;
    }
    .media-detail-media img, .media-detail-media video {
      display: block; width: 100%; max-height: 360px; object-fit: contain; background: #111;
    }
  </style>

    const STAGE_SHORT = { opc: "OPC 一人", s_3_20: "3–20", m_20_100: "20–100" };

    const TL_SINCE = "2025-09";

    function companyLabel(c) {
      if (!c) return "";
      return c.alias || c.display_name || c.company_code || c.code || "";
    }

    function companyAvatar(c, sizeClass) {
      if (!c) return "";
      const cls = `co-avatar${sizeClass ? " " + sizeClass : ""}`;
      if (c.logo) {
        const src = c.logo.startsWith("/") ? c.logo : `/${c.logo}`;
        return `<img class="${cls}" src="${esc(src)}" alt="" width="40" height="40" loading="lazy" />`;
      }
      const ch = (companyLabel(c) || "?").trim().charAt(0);
      return `<span class="${cls} fallback" aria-hidden="true">${esc(ch)}</span>`;
    }

    function esc(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /** 极简 markdown→html：##/###、列表 -、**粗体**、段落、链接、引用 */
    function mdInline(s) {
      let t = esc(s);
      t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, label, href) =>
        `<a href="${href}" target="_blank" rel="noopener">${label}</a>`
      );
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return t;
    }

    function mdToHtml(md) {
      const lines = String(md ?? "").replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inUl = false;
      let para = [];
      const flushPara = () => {
        if (!para.length) return;
        out.push(`<p>${mdInline(para.join(" "))}</p>`);
        para = [];
      };
      const closeUl = () => {
        if (!inUl) return;
        out.push("</ul>");
        inUl = false;
      };
      for (const raw of lines) {
        const line = raw.replace(/\s+$/, "");
        if (!line.trim()) {
          flushPara();
          closeUl();
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.+)$/);
        if (h) {
          flushPara();
          closeUl();
          const lvl = h[1].length === 1 ? 2 : h[1].length; // # 也当 h2，跟正文观感一致
          out.push(`<h${lvl}>${mdInline(h[2])}</h${lvl}>`);
          continue;
        }
        const bq = line.match(/^>\s?(.*)$/);
        if (bq) {
          flushPara();
          closeUl();
          out.push(`<blockquote><p>${mdInline(bq[1])}</p></blockquote>`);
          continue;
        }
        const li = line.match(/^[-*]\s+(.+)$/);
        if (li) {
          flushPara();
          if (!inUl) { out.push("<ul>"); inUl = true; }
          out.push(`<li>${mdInline(li[1])}</li>`);
          continue;
        }
        closeUl();
        para.push(line);
      }
      flushPara();
      closeUl();
      return out.join("") || `<p>${esc("（无正文）")}</p>`;
    }

    function sourceMark(mark) {
      if (mark === "qinqing") return `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#0f6f4f"/><path d="M5 8.2h6M8 5.1v6.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>`;
      if (mark === "hangzhou" || mark === "xihu") return `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.2" y="1.2" width="13.6" height="13.6" rx="2" fill="#8c1d1d"/><path d="M4.2 11.2V5.2h3.1a2.1 2.1 0 0 1 0 4.2H4.2" fill="none" stroke="#fff" stroke-width="1.3"/></svg>`;
      if (mark === "shanghai") return `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#1d4e89"/><circle cx="8" cy="8" r="2.1" fill="#fff"/></svg>`;
      if (mark === "gov") return `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.5 8 3l6 3.5V7H2V6.5Z" fill="#8c1d1d"/><path d="M3.2 8h1.4v4.2H3.2zM7.3 8h1.4v4.2H7.3zM11.4 8h1.4v4.2h-1.4zM2 12.6h12v1.2H2z" fill="#8c1d1d"/></svg>`;
      return `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="#8a8175" stroke-width="1.4" stroke-dasharray="2 2"/></svg>`;
    }

    function sourceChip(src) {
      if (!src) return "";
      const mark = sourceMark(src.mark);
      const label = src.name || src.platform || "来源";
      if (src.verified && src.url) {
        return `<a class="source-chip" href="${esc(src.url)}" target="_blank" rel="noopener">${mark}<span>${esc(label)}</span></a>`;
      }
      return `<span class="source-chip sample">${mark}<span>样例 · 不附链接</span></span>`;
    }

    function sourceBlock(item) {
      if (!item) return "";
      const bits = [sourceChip(item.source), sourceChip(item.source_also)].filter(Boolean);
      const note = item.source && item.source.note ? `<span class="cite" style="margin:0">${esc(item.source.note)}</span>` : "";
      if (!bits.length && !note) return "";
      return `<div class="source-row"><span class="badge muted">信息来源</span>${bits.join("")}${note}</div>`;
    }

    function timelineHtml(events) {
      if (!events || !events.length) return `<p class="cite">暂无沿革</p>`;
      const isEarly = (at) => {
        const s = String(at || "");
        if (!s || s === "此后" || s === "当前" || s.startsWith("此后")) return false;
        // YYYY-MM 或 YYYY-MM-DD：字面比较即可
        return s < TL_SINCE;
      };
      const early = events.filter((ev) => isEarly(ev.at));
      const recent = events.filter((ev) => !isEarly(ev.at));
      const renderLi = (ev) => {
        const cls = ev.horizon ? "horizon" : (ev.current ? "current" : "");
        return `<li class="${cls}"><span class="tl-dot"></span><div>
          <div class="tl-meta"><time>${esc(ev.at)}</time><span class="badge muted">${esc(ev.kind)}</span><span class="badge">${esc(STAGE_SHORT[ev.stage] || "")}</span></div>
          <strong>${esc(ev.title)}</strong>
          ${ev.note ? `<p>${esc(ev.note)}</p>` : ""}
        </div></li>`;
      };
      let expand = "";
      if (early.length && !expandTimelineHistory) {
        expand = `<button type="button" class="tl-expand" data-tl-expand>展开沿革（${early.length} 条 · 2025-09 前已收起）</button>`;
      } else if (early.length && expandTimelineHistory) {
        expand = `<button type="button" class="tl-expand" data-tl-collapse>收起 2025-09 前沿革</button>`;
      }
      const shown = expandTimelineHistory ? [...early, ...recent] : recent;
      return `<p class="tl-note">匹配仍只看当前档；全记录展示窗自 ${TL_SINCE} 起。</p>
        ${expand}
        <ol class="timeline">${shown.map(renderLi).join("")}</ol>`;
    }

    function matchCountOf(r, override) {
      if (override != null && override >= 0) return override;
      if (r && r.match_count != null) return Number(r.match_count) || 0;
      const ids = new Set();
      (r.company_ids || []).forEach((id) => { if (id) ids.add(String(id)); });
      (r.related_codes || []).forEach((code) => { if (code) ids.add(String(code)); });
      return ids.size;
    }

    function scopeRank(r) {
      const s = (r && r.scope) || "";
      if (s === "national") return 0;
      if (s === "provincial") return 1;
      if (s === "city") return 2;
      if (s === "district") return 3;
      // 启发式：文号含国/财建/工信部/发改
      const blob = `${r.doc_no || ""}${r.agency || ""}${r.title || ""}`;
      if (/国务院|财政部|科技部|工信部|发改委|国家/.test(blob)) return 0;
      if (/省|浙政/.test(blob)) return 1;
      if (/市|杭/.test(blob)) return 2;
      return 3;
    }

    function sortRadarItems(items) {
      const urg = { urgent: 0, watch: 1, ok: 2, expired: 3 };
      const list = (items || []).slice();
      if (radarSort === "window") {
        list.sort((a, b) => {
          const da = a.days_left != null ? a.days_left : 1e9;
          const db = b.days_left != null ? b.days_left : 1e9;
          return da - db || (urg[a.urgency] ?? 9) - (urg[b.urgency] ?? 9);
        });
        return list;
      }
      if (radarSort === "newest") {
        list.sort((a, b) => String(b.window_start || b.id).localeCompare(String(a.window_start || a.id)));
        return list;
      }
      // smart
      list.sort((a, b) => {
        const mc = matchCountOf(b) - matchCountOf(a);
        if (mc) return mc;
        const u = (urg[a.urgency] ?? 9) - (urg[b.urgency] ?? 9);
        if (u) return u;
        const dual = (b.dual_benefit ? 1 : 0) - (a.dual_benefit ? 1 : 0);
        if (dual) return dual;
        const ent = (b.helps_enterprise ? 1 : 0) - (a.helps_enterprise ? 1 : 0);
        if (ent) return ent;
        const sc = scopeRank(a) - scopeRank(b);
        if (sc) return sc;
        const da = a.days_left != null ? a.days_left : 1e9;
        const db = b.days_left != null ? b.days_left : 1e9;
        return da - db;
      });
      return list;
    }

    function highlightBlock(r, inline, overrideCount) {
      const n = matchCountOf(r, overrideCount);
      if (!n) return "";
      return `<div class="hl-amt${inline ? " inline" : ""}" title="初筛匹配企业数">
        <span class="num">${esc(String(n))}</span>
        <span class="unit">家</span>
        <span class="lab">匹配企业</span>
      </div>`;
    }

    function formatPubRel(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso).slice(0, 16);
      const diff = Date.now() - d.getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins <= 1 ? "刚刚" : `${mins} 分钟前`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天前`;
      if (days < 30) return `${Math.floor(days / 7)} 周前`;
      return String(iso).slice(0, 10);
    }

    function stripShowPlayer(text) {

      seal.textContent = ch ? ch[0] : "专";
      seal.title = label.split("/")[0].trim() || "运营专员";
      seal.setAttribute("aria-label", seal.title);
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    async function copyText(text, okMsg) {
      if (!text) { toast("暂无内容可复制"); return; }
      await navigator.clipboard.writeText(text);
      toast(okMsg || "已复制到剪贴板");
    }

    function draftBlock(text, matchId) {
      if (!text) return "";
      const escaped = String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return `<div class="draft-inline">
        <label>触达草稿（复制到既有微信 · 系统不代发）</label>
        <pre>${escaped}</pre>
        <div class="actions" style="margin-top:0">
          <button class="act primary" data-copy-draft="${matchId || ""}">复制草稿</button>
        </div>
      </div>`;
    }

    function bindDraftCopy(draftMap) {
      document.querySelectorAll("[data-copy-draft]").forEach((el) => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-copy-draft");
          const text = (id && draftMap[id]) || Object.values(draftMap)[0] || "";
          copyText(text, "草稿已复制");
        };
      });
    }

    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function stateBadge(state) {
      if (state === "符合" || state === "已审核" || state === "passed") return "ok";
      if (state === "待核验" || state === "待检验" || state === "待审核" || state === "active") return "warn";
      if (state === "rejected") return "bad";
      return "bad";
    }

    function sopStatusBadge(m) {
      const st = m.sop_status || "active";
      if (st === "passed") return `<span class="badge ok">已通过</span>`;
      if (st === "rejected") return `<span class="badge bad">未通过</span>`;
      const step = (m.sop_steps || [])[m.current ?? m.sop_step ?? 0];
      const lab = step ? step.label : "发送";
      return `<span class="badge warn">${esc(lab)}</span>`;
    }

    function sopTrackHtml(m) {
      const steps = m.sop_steps || [];
      if (!steps.length) return "";
      const nodes = steps.map((s) => {
        const st = s.state || "pending";
        const mark = st === "done" ? "✓" : (st === "rejected" ? "!" : String((s.index ?? 0) + 1));
        return `<div class="sop-node ${esc(st)}">
          <div class="sop-dot">${mark}</div>
          <div class="sop-lab">${esc(s.label || "")}</div>
        </div>`;
      }).join("");
      return `<div class="sop-track"><div class="sop-nodes">${nodes}</div></div>`;
    }

    function sopActions(m, cid) {
      const company = cid || m.company_id || "";
      const st = m.sop_status || "active";
      const primary = m.primary_action;
      const step = m.current ?? m.sop_step ?? 0;
      let btns = "";
      if (st === "active" && primary) {
        const act = step === 1 ? "accept" : "next";
        btns += `<button class="act primary" data-sop="${act}" data-mid="${m.id}" data-cid="${company}">${esc(primary)}</button>`;
      } else if (st === "passed") {
        btns += `<span class="badge ok">办理已通过</span>`;
      } else if (st === "rejected") {
        btns += `<span class="badge bad">未通过 / 驳回</span>`;
      }
      if (m.can_back || st === "rejected" || st === "passed") {
        const backLabel = st === "active" ? "退回上一步" : "重置进度";
        btns += `<button class="act" data-sop="reset" data-mid="${m.id}" data-cid="${company}">${backLabel}</button>`;
      }
      if (m.can_reject) {
        btns += `<button class="act" data-sop="reject" data-mid="${m.id}" data-cid="${company}">驳回</button>`;
      }
      return `<div class="actions match-actions sop-actions">${btns}</div>`;
    }

    function setBusy(on) {
      loading = on;
      document.getElementById("content").classList.toggle("busy", on);
    }

    function benefitChips() {
      const opts = [
        { id: "both", label: "园企双益" },
        { id: "park", label: "助园" },
        { id: "enterprise", label: "助企" },
        { id: "all", label: "全部口径" },
      ];
      return opts.map((o) =>
        `<button class="chip ${benefitFilter === o.id ? "on" : ""}" data-benefit="${o.id}">${o.label}</button>`
      ).join("");
    }

    function channelChips() {
      return CHANNELS.map((o) =>
        `<button class="chip ${radarChannel === o.id ? "on" : ""}" data-channel="${o.id}">${o.label}</button>`
      ).join("");
    }

    async function loadRadar() {
      const q = new URLSearchParams();
      if (radarChannel) q.set("channel", radarChannel);
      if (showHistoryArchive) {
        q.set("benefit", "all");
        q.set("include_expired", "1");
      } else {
        q.set("benefit", benefitFilter);
      }
      const data = await api(`/api/policy_radar?${q}`);
      radarItems = data.items || [];
      setApiStatus("");
      return data;
    }

    async function loadRadarMatches(radarId) {
      if (!radarId) { radarMatchItems = []; return; }
      const q = new URLSearchParams({ radar_id: radarId, benefit: benefitFilter });
      const data = await api(`/api/policy_match_for?${q}`);
      radarMatchItems = data.items || [];
    }

    async function loadPolicyBody(radarId) {
      if (!radarId) { policyBodyText = ""; return; }
      try {
        const data = await api(`/api/policy_body?id=${encodeURIComponent(radarId)}`);
        policyBodyText = data.text || "";
      } catch {
        policyBodyText = "";
      }
    }

    async function loadCompanies() {
      const q = sizeBand ? `?size_band=${encodeURIComponent(sizeBand)}` : "";
      const data = await api(`/api/companies${q}`);
      companies = data.companies || [];
      return data;
    }

    async function loadMediaHot() {
      const q = new URLSearchParams();
      if (mediaQ) q.set("q", mediaQ);
      if (mediaSource && mediaSource !== "all") q.set("source", mediaSource);
      const t = MEDIA_TIME.find((x) => x.id === mediaTime) || MEDIA_TIME[2];
      if (t.days != null) q.set("days", String(t.days));
      if (t.since) q.set("since", t.since);
      const data = await api(`/api/media_hotspots?${q}`);
      mediaItems = data.items || [];
      mediaMeta = data;
      if (selectedMedia && !mediaItems.some((x) => x.id === selectedMedia)) {
        selectedMedia = mediaItems[0] ? mediaItems[0].id : null;
      } else if (!selectedMedia && mediaItems[0]) {
        selectedMedia = mediaItems[0].id;
      }
      setApiStatus("");
      return data;
    }

    async function openCompany(id, opts = {}) {
      selectedCompany = id;
      expandTimelineHistory = false;
      setBusy(true);
      try {
        const [profile, match] = await Promise.all([
          api(`/api/company_profile?company_id=${encodeURIComponent(id)}`),
          api(`/api/policy_match?company_id=${encodeURIComponent(id)}`),
        ]);
        matchPayload = { profile, match };
        if (view !== "companies") {
          view = "companies";
          syncNav();
        }
        render();
        if (opts.scroll !== false) {
          requestAnimationFrame(() => {
            document.querySelector(".split-detail")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
          });
        }
      } finally {
        setBusy(false);
      }
    }

    async function refreshAfterMatchAction(cid) {
      if (view === "radar" && selectedRadar) {
        await loadRadarMatches(selectedRadar);
        render();
      } else if (cid) {
        await openCompany(cid, { scroll: false });
      } else {
        render();
      }
    }

    async function confirmMatch(matchId, action, companyId) {
      const cid = companyId || selectedCompany;
      const operator = document.getElementById("operator").value;
      setBusy(true);
      try {
        const out = await api("/api/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ company_id: cid, match_id: matchId, action, operator }),
        });
        if (out.draft) toast("已确认 · 草稿已生成，可复制推送");
        else if (action === "reject") toast("已驳回 · 已记入操作日志");
        else if (action === "escalate") toast("已升级主管 · 已记入操作日志");
        await refreshAfterMatchAction(cid);
      } catch (e) {
        toast(e.message || "操作失败");
      } finally {
        setBusy(false);
      }
    }

    function bindBenefitChips(reload) {
      document.querySelectorAll("[data-benefit]").forEach((el) => {
        el.onclick = async () => {
          benefitFilter = el.getAttribute("data-benefit");
          setBusy(true);
          try { await reload(); } finally { setBusy(false); }
        };
      });
    }

    function bindConfirmActions(fallbackCid) {
      document.querySelectorAll("[data-confirm]").forEach((el) => {
        el.onclick = (e) => {
          e.stopPropagation();
          confirmMatch(el.getAttribute("data-confirm"), "confirm", el.getAttribute("data-cid") || fallbackCid);
        };
      });
      document.querySelectorAll("[data-submit],[data-return]").forEach((el) => {
        el.onclick = async (e) => {
          e.stopPropagation();
          const action = el.hasAttribute("data-submit") ? "submit" : "return";
          const matchId = el.getAttribute("data-submit") || el.getAttribute("data-return");
          const cid = el.getAttribute("data-cid") || fallbackCid;
          setBusy(true);
          try {
            await api("/api/review", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ company_id: cid, match_id: matchId, action }),
            });
            toast(action === "submit" ? "已送审 · 进入待审核" : "已退回 · 待检验");
            await refreshAfterMatchAction(cid);
          } catch (err) {
            toast(err.message || "操作失败");
          } finally {
            setBusy(false);
          }
        };
      });
      document.querySelectorAll("[data-sop]").forEach((el) => {
        el.onclick = async (e) => {
          e.stopPropagation();
          const action = el.getAttribute("data-sop");
          const matchId = el.getAttribute("data-mid");
          const cid = el.getAttribute("data-cid") || fallbackCid;
          const operator = document.getElementById("operator").value;
          setBusy(true);
          try {
            const out = await api("/api/sop", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                company_id: cid,
                match_id: matchId,
                action,
                operator,
              }),
            });
            if (action === "next" && out.draft) toast("已发送 · 草稿可复制（系统不代发微信）");
            else if (action === "next") toast("节点已推进");
            else if (action === "accept") toast("已标记企业接受");
            else if (action === "reject") toast("已驳回 · 终态未通过");
            else if (action === "reset") toast("已退回上一步");
            await refreshAfterMatchAction(cid);
          } catch (err) {
            toast(err.message || "SOP 操作失败");
          } finally {
            setBusy(false);
          }
        };
      });
    }

    function closeRadarModal() {
      selectedRadar = null;
      radarMatchItems = [];
      policyBodyText = "";
      render();
    }

    function policyOfficialUrl(item, bodyText) {
      const direct = (item && (item.source_url || (item.source && item.source.url))) || "";
      if (direct) return direct;
      const m = String(bodyText || "").match(/https?:\/\/[^\s)）\]>"']+/);
      return m ? m[0].replace(/[.,;；。]+$/, "") : "";
    }

    function whySuitableLines(matches) {
      const lines = (matches || []).slice(0, 3).map((m) => {
        const name = companyLabel(m) || m.company_code || "";
        const band = SIZE_LABELS[m.size_band] || m.headcount_range || "";
        const dir = m.direction || "";
        const scene = m.scene || "";
        const bits = [dir, band].filter(Boolean).join(" · ");
        if (scene) return `${name}${bits ? `（${bits}）` : ""}：${scene}`;
        if (bits) return `${name}：${bits}`;
        return name ? `${name}进入初筛匹配。` : "";
      }).filter(Boolean);
      return lines;
    }

    function needDoBullets(item, matches) {
      const gaps = [];
      const seen = new Set();
      (matches || []).forEach((m) => {
        const g = String(m.gap || "").trim();
        if (g && !seen.has(g)) { seen.add(g); gaps.push(g); }
      });
      if (gaps.length) return gaps.slice(0, 3);
      const hard = (item && item.hard_criteria) || [];
      if (hard.length) return hard.slice(0, 3);
      return ["补齐待检字段后申报"];
    }

    function benefitBullets(item) {
      const out = [];
      const seen = new Set();
      const push = (s) => {
        const t = String(s || "").trim();
        if (!t || seen.has(t)) return;
        seen.add(t);
        out.push(t);
      };
      push(item && item.enterprise_help);
      push(item && item.subsidy_detail);
      if (out.length < 2) push(item && item.value_one_liner);
      return out.slice(0, 2);
    }

    function policyTimeHint(item) {
      if (!item) return "";
      if (isPublicEvent(item)) {
        const range = eventTimeRange(item);
        return range ? `活动时间 ${range}` : "";
      }
      if (item.urgency === "expired") {
        return item.window_end ? `申报截止 ${item.window_end} · 已过窗` : "窗口已关闭";
      }
      if (item.days_left != null) return `剩 ${item.days_left} 天`;
      if (item.window_end) return `申报截止 ${item.window_end}`;
      return item.window || "";
    }

    async function selectRadar(id) {
      selectedRadar = id;
      policyBodyText = "";
      setBusy(true);
      try {
        await Promise.all([loadRadarMatches(id), loadPolicyBody(id)]);
        render();
      } finally {
        setBusy(false);
      }
    }

    function isPublicEvent(r) {
      return !!(r && (r.channel === "公开活动" || String(r.track || "").includes("公开活动")));
    }

    function eventTimeRange(r) {
      const a = String(r.event_start || r.window_start || "").slice(0, 10);
      const b = String(r.event_end || r.window_end || "").slice(0, 10);
      if (!a && !b) return "";
      if (a && b && a === b) return a;
      if (a && b) return `${a} ~ ${b}`;
      return a || b;
    }

    function eventTimeLine(r, asHtml) {
      const range = eventTimeRange(r);
      if (!range) return "";
      return asHtml
        ? `<p class="cite event-time"><strong>活动时间</strong>　${esc(range)}</p>`
        : `活动时间：${range}`;
    }

    function renderRadar() {
      const sorted = sortRadarItems(radarItems);
      const cards = sorted.map((r) => {
        const active = selectedRadar === r.id ? "active" : "";
        const expired = r.urgency === "expired" ? "expired" : "";
        const tag = r.doc_no || (r.source && r.source.name) || r.agency || r.channel || "";
        const pub = isPublicEvent(r);
        let corner = "";
        if (pub) {
          const range = eventTimeRange(r);
          if (r.urgency === "expired") {
            corner = `<span class="badge muted">已过期</span>`;
          } else if (range) {
            corner = `<span class="badge muted">${esc(range)}</span>`;
          }
        } else if (r.lifecycle_status === "superseded") {
          corner = `<span class="badge bad" style="background:#fee2e2;color:#dc2626;border-color:#fca5a5;font-weight:600">⚠️ 已被新规替代</span>`;
        } else if (r.lifecycle_status === "expired" || r.urgency === "expired") {
          corner = `<span class="badge muted">窗口已关闭</span>`;
        } else if (r.lifecycle_status === "expiring" || (r.days_left != null && (r.urgency === "urgent" || r.urgency === "watch"))) {
          const cls = r.urgency === "urgent" ? "bad" : "warn";
          corner = r.days_left != null
            ? `<span class="badge ${cls}">剩 ${r.days_left} 天</span>`
            : `<span class="badge warn">申报即将截止</span>`;
        } else if (r.lifecycle_status === "active") {
          corner = `<span class="badge ok">申报受理中</span>`;
        } else if (r.days_left != null && (r.urgency === "urgent" || r.urgency === "watch")) {
          const cls = r.urgency === "urgent" ? "bad" : "warn";
          corner = `<span class="badge ${cls}">剩 ${r.days_left} 天</span>`;
        } else if (r.days_left != null && r.days_left >= 0) {
          corner = `<span class="badge muted">剩 ${r.days_left} 天</span>`;
        }
        const scopeBadge = r.scope === "national"
          ? `<span class="badge ok">全国</span>`
          : (r.scope === "provincial" ? `<span class="badge muted">省级</span>` : "");
        const timeHint = pub && eventTimeRange(r)
          ? `<div class="cite event-time" style="margin-top:4px">活动时间：${esc(eventTimeRange(r))}</div>`
          : "";
        return `<div class="card ${active} ${expired}" data-radar="${r.id}">
          <div class="card-title-row">
            <h3>${esc(r.title)}</h3>
            ${corner}
          </div>
          <div class="meta">${scopeBadge}<span class="badge muted">${esc(tag)}</span></div>
          <div class="card-body-row">
            <div>
              <div class="cite">${esc(r.value_one_liner || "")}</div>
              ${timeHint}
            </div>
            ${highlightBlock(r, false)}
          </div>
        </div>`;
      }).join("");

      const item = sorted.find((x) => x.id === selectedRadar) || radarItems.find((x) => x.id === selectedRadar);
      let modal = "";
      if (item) {
        const url = policyOfficialUrl(item, policyBodyText);
        const why = whySuitableLines(radarMatchItems);
        const needDo = needDoBullets(item, radarMatchItems);
        const benefits = benefitBullets(item);
        const timeHint = policyTimeHint(item);
        const logos = radarMatchItems.length
          ? radarMatchItems.map((m) => {
              const co = {
                id: m.company_id,
                code: m.company_code,
                alias: m.alias,
                display_name: m.display_name,
                logo: m.logo,
              };
              return `<button type="button" class="pm-logo-btn" data-goto-company="${esc(m.company_id)}" title="${esc(companyLabel(co))}">
                ${companyAvatar(co)}
                <span>${esc(companyLabel(co))}</span>
              </button>`;
            }).join("")
          : `<span class="pm-empty-logos">当前筛选下暂无匹配企业</span>`;

        const leftBody = policyBodyText
          ? `<div class="policy-body">${mdToHtml(policyBodyText)}</div>`
          : `<p class="cite">${esc(item.citation || "暂无正文摘录")}</p>
             ${url ? `<div class="actions"><a class="act primary" href="${esc(url)}" target="_blank" rel="noopener">打开官方发文原文</a></div>` : ""}`;

        const primaryCid = radarMatchItems[0] && radarMatchItems[0].company_id;
        modal = `
          <div class="policy-modal-overlay" data-close-modal>
            <div class="policy-modal" role="dialog" aria-modal="true" aria-label="政策详情" data-modal-panel>
              <button type="button" class="policy-modal-close" data-close-modal aria-label="关闭">×</button>
              <div class="policy-modal-cols">
                <div class="policy-modal-left">
                  <div class="pm-head">
                    <h2>${esc(item.title)}</h2>
                    <div class="pm-doc">${esc([item.doc_no, item.agency].filter(Boolean).join(" · "))}</div>
                  </div>
                  ${leftBody}
                </div>
                <div class="policy-modal-right">
                  <div class="pm-logos">${logos}</div>
                  <section class="pm-sec">
                    <h3>为何适合</h3>
                    ${why.length
                      ? why.map((line) => `<p>${esc(line)}</p>`).join("")
                      : `<p>暂无匹配企业场景，待补齐画像后再看适配度。</p>`}
                  </section>
                  <section class="pm-sec">
                    <h3>需要怎么做</h3>
                    <ul>${needDo.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
                  </section>
                  <section class="pm-sec">
                    <h3>能带来什么</h3>
                    <ul>${(benefits.length ? benefits : ["见左侧原文要点"]).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
                  </section>
                  <div class="pm-foot">
                    ${timeHint ? `<p class="pm-time">${esc(timeHint)}</p>` : ""}
                    <div class="actions">
                      ${url ? `<a class="act primary" href="${esc(url)}" target="_blank" rel="noopener">打开官方页面</a>` : ""}
                      ${primaryCid ? `<button type="button" class="act" data-goto-company="${esc(primaryCid)}">进入企业画像</button>` : ""}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      const sortChips = [
        { id: "smart", label: "智能排序" },
        { id: "window", label: "仅剩窗口" },
        { id: "newest", label: "最新录入" },
      ].map((o) =>
        `<button class="chip ${radarSort === o.id ? "on" : ""}" data-radar-sort="${o.id}">${o.label}</button>`
      ).join("");

      paint(`
        <div class="hint" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
          <span>点选政策查看原文与匹配分析</span>
          <div style="display:flex;gap:8px;align-items:center;">
            <a href="/POLICY_COLLECTION_SOP.md" target="_blank" class="chip" style="color:var(--seal);font-weight:600;text-decoration:none;border-color:var(--seal);padding:3px 8px;font-size:11px;">📖 查看自动搜集SOP手册</a>
            <button type="button" class="chip ${showHistoryArchive ? "on" : ""}" id="btn-toggle-archive" style="font-size:11px;${showHistoryArchive ? "background:#fee2e2;border-color:#fca5a5;color:#991b1b;" : ""}">
              ${showHistoryArchive ? "📋 正在查看全量对照（含已废止/过期）" : "✓ 现行申报有效（点击查看废止/过期对照）"}
            </button>
          </div>
        </div>
        <div class="filter-row"><span class="lbl">渠道</span>${channelChips()}</div>
        <div class="filter-row"><span class="lbl">受益</span>${benefitChips()}</div>
        <div class="filter-row"><span class="lbl">排序</span>${sortChips}</div>
        <div class="split radar-layout">
          <div class="split-list list">${cards || '<div class="empty">当前筛选无条目</div>'}</div>
          <div class="split-detail"><div class="empty">点选政策查看</div></div>
        </div>
        ${modal}
      `);

      const toggleArchiveBtn = document.getElementById("btn-toggle-archive");
      if (toggleArchiveBtn) {
        toggleArchiveBtn.onclick = async () => {
          showHistoryArchive = !showHistoryArchive;
          selectedRadar = null;
          radarMatchItems = [];
          policyBodyText = "";
          setBusy(true);
          try {
            await loadRadar();
            render();
          } finally {
            setBusy(false);
          }
        };
      }

      bindBenefitChips(async () => {
        selectedRadar = null; radarMatchItems = []; policyBodyText = "";
        await loadRadar(); render();
      });
      document.querySelectorAll("[data-channel]").forEach((el) => {
        el.onclick = async () => {
          radarChannel = el.getAttribute("data-channel");
          selectedRadar = null; radarMatchItems = []; policyBodyText = "";
          setBusy(true);
          try { await loadRadar(); render(); } finally { setBusy(false); }
        };
      });
      document.querySelectorAll("[data-radar-sort]").forEach((el) => {
        el.onclick = () => {
          radarSort = el.getAttribute("data-radar-sort") || "smart";
          render();
        };
      });
      document.querySelectorAll("[data-radar]").forEach((el) => {
        el.onclick = () => selectRadar(el.getAttribute("data-radar"));
      });
      document.querySelectorAll("[data-goto-company]").forEach((el) => {
        el.onclick = (e) => {
          e.stopPropagation();
          const cid = el.getAttribute("data-goto-company");
          selectedRadar = null;
          radarMatchItems = [];
          policyBodyText = "";
          openCompany(cid);
        };
      });
      document.querySelectorAll("[data-close-modal]").forEach((el) => {
        el.onclick = (e) => {
          if (el.hasAttribute("data-modal-panel")) return;
          if (el.classList.contains("policy-modal-overlay") && e.target !== el) return;
          closeRadarModal();
        };
      });
      const panel = document.querySelector("[data-modal-panel]");
      if (panel) {
        panel.onclick = (e) => e.stopPropagation();
      }
    }

    function renderCompanies() {
      const filters = [
        { id: "", label: "全部规模" },
        { id: "opc", label: "OPC" },
        { id: "s_3_20", label: "3–20" },
        { id: "m_20_100", label: "20–100" },
      ].map((o) =>
        `<button class="chip ${sizeBand === o.id ? "on" : ""}" data-size="${o.id}">${o.label}</button>`
      ).join("");

      const cards = companies.map((c) => {
        const active = selectedCompany === c.id ? "active" : "";
        const band = SIZE_LABELS[c.size_band] || c.headcount_range;
        return `<div class="card ${active}" data-company="${c.id}">
          <div class="co-row">
            ${companyAvatar(c)}
            <div>
              <h3>${esc(companyLabel(c))} · ${esc(c.direction || "")}</h3>
              ${c.address ? `<div class="co-addr">${esc(c.address)}</div>` : ""}
              <div class="meta">
                <span class="badge muted size-tag">${esc(band)}</span>
                <span>${esc(c.headcount_range || "")}</span>
              </div>
              ${c.stage_path ? `<div class="stage-path">${esc(c.stage_path)}</div>` : ""}
            </div>
          </div>
        </div>`;
      }).join("");

      let detail = `<div class="empty">左侧点选脱敏企业<br/>无真实公司名 · 非 CRM</div>`;
      if (matchPayload && matchPayload.profile && matchPayload.match) {
        const c = matchPayload.profile.company;
        const bandsH = c.headcount_bands || {};
        const fieldName = {
          entity_type: "主体", lease_area_band: "面积", tax_local: "税务",
          social_insurance: "社保", rd_ratio_band: "研发占比", biz_type: "业务",
          platform_data: "数据来源", coop_interest: "合作意向", stage: "阶段",
        };
        const pendingFields = Object.entries(c.fields || {})
          .filter(([, f]) => !f.confirmed)
          .map(([k, f]) => `<div class="cite">${fieldName[k] || k}：${esc(f.value)} · 待检验</div>`)
          .join("");
        const team = (c.team || []).map((t) =>
          `<div class="team-chip"><b>${esc(t.role)}</b>${esc(t.note || "")}</div>`
        ).join("");
        const works = (c.portfolio || []).map((p) =>
          `<div class="portfolio-card">
            <div class="portfolio-cover" style="background:${esc(p.tone || "#0f6f4f")}"></div>
            <strong>${esc(p.title)}</strong>
            <p>${esc(p.blurb || "")}</p>
          </div>`
        ).join("");
        const matches = (matchPayload.match.matches || []).map((m) => `
          <div class="match" data-goto-radar="${esc(m.radar && m.radar.id || "")}" style="cursor:pointer">
            <div class="meta">${sopStatusBadge(m)}</div>
            <h3 style="font-size:15px;margin:8px 0 0;font-family:'Noto Serif SC',serif">${esc(m.radar.title || "")}</h3>
            <div class="cite">${esc(m.radar.enterprise_help || m.citation)}</div>
            ${m.gap ? `<div class="gap">${esc(m.gap)}</div>` : ""}
            ${sopTrackHtml(m)}
            ${sopActions(m, selectedCompany)}
            ${draftBlock(m.draft, m.id)}
          </div>`).join("");

        detail = `
          <div class="detail-head">
            ${companyAvatar(c, "lg")}
            <div>
              <h2>${esc(companyLabel(c))}</h2>
              <p class="cite" style="margin-top:0">${esc(c.direction)} · ${esc(c.headcount_range || "")} · ${esc(c.funding_stage || "")}</p>
              ${c.address ? `<p class="co-addr" style="margin:4px 0 0">${esc(c.address)}</p>` : ""}
            </div>
          </div>
          <p class="cite"><strong>场景</strong>　${esc(c.scene || c.direction || "")}</p>
          <p class="cite" style="margin-bottom:0"><strong>人员</strong></p>
          <div class="team-row">${team || '<span class="cite">暂无</span>'}</div>
          <p class="cite" style="margin-bottom:0"><strong>虚拟作品</strong>（案例示意）</p>
          <div class="portfolio-grid">${works || '<span class="cite">暂无</span>'}</div>
          <p class="cite">人员结构：研发 ${bandsH.rd || 0}% · 业务 ${bandsH.biz || 0}% · 其他 ${bandsH.other || 0}%</p>
          ${pendingFields || `<p class="cite">字段均已确认</p>`}
          <h3 style="font-size:14px;margin:14px 0 0;font-family:'Noto Serif SC',serif">全记录</h3>
          ${timelineHtml(c.timeline)}
          <h3 style="font-size:14px;margin:18px 0 0;font-family:'Noto Serif SC',serif">当前可匹配</h3>
          ${matches || '<div class="empty">无匹配</div>'}`;
      }

      paint(`
        <div class="hint">点选企业看画像与当前匹配</div>
        <div class="filters">${filters}</div>
        <div class="split">
          <div class="split-list list">${cards || '<div class="empty">该规模暂无样例</div>'}</div>
          <div class="split-detail">${detail}</div>
        </div>
      `);

      document.querySelectorAll("[data-size]").forEach((el) => {
        el.onclick = async () => {
          sizeBand = el.getAttribute("data-size");
          selectedCompany = null; matchPayload = null;
          setBusy(true);
          try { await loadCompanies(); render(); } finally { setBusy(false); }
        };
      });
      document.querySelectorAll("[data-company]").forEach((el) => {
        el.onclick = () => openCompany(el.getAttribute("data-company"));
      });
      document.querySelectorAll("[data-goto-radar]").forEach((el) => {
        el.onclick = async (e) => {
          if (e.target.closest(".match-actions")) return;
          const rid = el.getAttribute("data-goto-radar");
          if (!rid) return;
          view = "radar";
          syncNav();
          setBusy(true);
          try {
            await loadRadar();
            await selectRadar(rid);
          } finally { setBusy(false); }
        };
      });
      bindConfirmActions(selectedCompany);
      const draftMap = {};
      ((matchPayload && matchPayload.match && matchPayload.match.matches) || []).forEach((m) => {
        if (m.draft) draftMap[m.id] = m.draft;
      });
      if (Object.keys(draftMap).length) bindDraftCopy(draftMap);
      document.querySelectorAll("[data-tl-expand]").forEach((el) => {
        el.onclick = () => { expandTimelineHistory = true; render(); };
      });
      document.querySelectorAll("[data-tl-collapse]").forEach((el) => {
        el.onclick = () => { expandTimelineHistory = false; render(); };
      });
    }

    function renderSkills() {
      const pills = SKILL_PLATFORMS.map((p) =>
        `<button class="platform-pill ${skillsPlatform === p ? "on" : ""}" data-platform="${p}">${PLATFORM_MARKS[p] || ""}<span>${p}</span></button>`
      ).join("");
      paint(`
        <div class="skills-hero">
          <h2>一句话接入你的 Agent</h2>
          <p class="lead">把云谷企服运营台能力接到你正在用的 Agent。系统只出草稿，不代发微信。</p>
          <div class="platform-pills">${pills}</div>
          <div class="term-block">
            <div><span class="prompt">$</span> <span class="cmd">${SKILLS_INSTALL}</span></div>
            <span class="hint-line"># 当前选择：${skillsPlatform}</span>
          </div>
          <div class="actions" style="margin-top:12px">
            <button class="act primary" id="copyInstall">复制安装命令</button>
          </div>
          <p class="skills-note">完整契约见 <a href="${apiBase}/skills.md" target="_blank" style="color:var(--accent);text-decoration:underline"><code>${apiBase}/skills.md</code></a> · API 基址 <code>${apiBase}</code></p>
        </div>
      `);
      document.querySelectorAll("[data-platform]").forEach((el) => {
        el.onclick = () => {
          skillsPlatform = el.getAttribute("data-platform");
          renderSkills();
        };
      });
      document.getElementById("copyInstall").onclick = () =>
        copyText(SKILLS_INSTALL, "安装命令已复制");
    }

    function topicBadge(t) {
      if (t === "policy") return `<span class="badge seal">政策</span>`;
      if (t === "ai") return `<span class="badge ok">AI</span>`;
      return `<span class="badge muted">${esc(t || "")}</span>`;
    }

    function mediaTypeBadge(mt) {
      if (mt === "video") return `<span class="badge warn">视频</span>`;
      if (mt === "image") return `<span class="badge muted">图文</span>`;
      return `<span class="badge muted">链接</span>`;
    }

    function renderMediaHot() {
      const srcChips = MEDIA_SOURCES.map((c) =>
        `<button class="chip ${mediaSource === c.id ? "on" : ""}" data-media-source="${c.id}">${c.label}</button>`
      ).join("");
      const kwChips = MEDIA_KW.map((k) =>
        `<button class="chip ${mediaQ === k ? "on" : ""}" data-media-q="${esc(k)}">${k || "默认词"}</button>`
      ).join("");
      const timeChips = MEDIA_TIME.map((t) =>
        `<button class="chip ${mediaTime === t.id ? "on" : ""}" data-media-time="${t.id}">${t.label}</button>`
      ).join("");
      const notices = [];
      if (mediaMeta && mediaMeta.allnet_notice) {
        notices.push(`<div class="media-banner">Allnet：${esc(mediaMeta.allnet_notice)} · 鉴权头 <code>X-API-Key</code> · 环境变量 <code>ALLNET_API_KEY</code>（勿入库）。</div>`);
      } else if (mediaMeta && mediaMeta.allnet_configured) {
        notices.push(`<div class="media-banner ok">Allnet OpenAPI 已接通 · 主数据源</div>`);
      }
      if (mediaMeta && mediaMeta.tikhub_notice) {
        notices.push(`<div class="media-banner">TikHub：${esc(mediaMeta.tikhub_notice)} · <code>TIKHUB_API_KEY</code></div>`);
      }
      const notice = notices.join("");
      const sources = (mediaMeta && mediaMeta.sources || []).map((s) => {
        const cls = s.ok ? "on" : "off";
        return `<span class="${cls}">${esc(s.name)} · ${esc(s.detail || (s.ok ? "OK" : "降级"))}</span>`;
      }).join("");
      const cards = mediaItems.map((it) => {
        const active = selectedMedia === it.id ? "active" : "";
        const sample = it.is_sample ? `<span class="badge warn">样例</span>` : "";
        let mediaEl = "";
        if (it.video_url) {
          mediaEl = `<video class="media-thumb" muted playsinline preload="metadata" poster="${esc(it.thumb || "")}" src="${esc(it.video_url)}"></video>`;
        } else if (it.thumb) {
          mediaEl = `<img class="media-thumb" src="${esc(it.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" />`;
        } else {
          mediaEl = `<div class="media-thumb ph">${it.media_type === "video" ? "视频" : "无图"}</div>`;
        }
        const rel = formatPubRel(it.published_at);
        return `<div class="card ${active}" data-media="${esc(it.id)}">
          <div class="media-card-row">
            ${mediaEl}
            <div>
              <h3>${esc(it.title)}</h3>
              <div class="meta">${sample}${mediaTypeBadge(it.media_type)}
                <span class="badge muted">${esc(it.source || "")}</span>
                <span class="pub-time">${esc(rel || (it.published_at || "").slice(0, 10))}</span>
              </div>
            </div>
          </div>
        </div>`;
      }).join("") || `<div class="empty">暂无条目<br/>可换关键词或检查网络</div>`;

      const item = mediaItems.find((x) => x.id === selectedMedia);
      let detail = `<div class="empty">点选左侧条目查看图/视频</div>`;
      if (item) {
        let mediaBlock = "";
        if (item.video_url) {
          mediaBlock = `<div class="media-detail-media"><video controls playsinline poster="${esc(item.thumb || "")}" src="${esc(item.video_url)}"></video></div>`;
        } else if (item.thumb) {
          mediaBlock = `<div class="media-detail-media"><img src="${esc(item.thumb)}" alt="" referrerpolicy="no-referrer" /></div>`;
        } else {
          mediaBlock = `<div class="media-banner">本条无直出媒体，请打开原文查看</div>`;
        }
        const summary = stripShowPlayer(item.summary || "");
        const rel = formatPubRel(item.published_at);
        detail = `<div class="detail">
          <h2>${esc(item.title)}</h2>
          <div class="meta" style="margin-top:6px">
            ${item.is_sample ? `<span class="badge warn">样例</span>` : ""}
            ${mediaTypeBadge(item.media_type)}
            <span class="badge muted">${esc(item.source || "")}</span>
            <span class="pub-time">${esc(rel)}</span>
            <span class="badge muted">${esc((item.published_at || "").slice(0, 10))}</span>
            <span class="badge muted">${esc(item.provider || "")}</span>
          </div>
          ${mediaBlock}
          ${summary ? `<p class="cite">${esc(summary)}</p>` : ""}
          <div class="actions">
            <a class="act primary" href="${esc(item.url)}" target="_blank" rel="noopener">打开原文</a>
          </div>
          <p class="hint" style="margin-top:14px">政策/园区向公开聚合 · 不代发微信 · 不编造公文</p>
        </div>`;
      }

      paint(`
        <p class="hint">媒体信息热点 · 主源 Allnet OpenAPI · 补充 TikHub / RSS · 筛 AI/政策向 · 默认自 2025-09</p>
        <div class="filter-row"><span class="lbl">时间</span>${timeChips}</div>
        <div class="filter-row"><span class="lbl">来源</span>${srcChips}</div>
        <div class="filter-row"><span class="lbl">关键词</span>${kwChips}</div>
        ${notice}
        <div class="media-sources">${sources}</div>
        <div class="split">
          <div class="split-list list">${cards}</div>
          <div class="split-detail">${detail}</div>
        </div>
      `);

      document.querySelectorAll("[data-media-time]").forEach((el) => {
        el.onclick = async () => {
          mediaTime = el.getAttribute("data-media-time") || "since";
          selectedMedia = null;
          setBusy(true);
          try { await loadMediaHot(); render(); } finally { setBusy(false); }
        };
      });
      document.querySelectorAll("[data-media-source]").forEach((el) => {
        el.onclick = async () => {
          mediaSource = el.getAttribute("data-media-source");
          selectedMedia = null;
          setBusy(true);
          try { await loadMediaHot(); render(); } finally { setBusy(false); }
        };
      });
      document.querySelectorAll("[data-media-q]").forEach((el) => {
        el.onclick = async () => {
          mediaQ = el.getAttribute("data-media-q") || "";
          selectedMedia = null;
          setBusy(true);
          try { await loadMediaHot(); render(); } finally { setBusy(false); }
        };
      });
      document.querySelectorAll("[data-media]").forEach((el) => {
        el.onclick = () => {
          selectedMedia = el.getAttribute("data-media");
          render();
        };
      });
    }

    function render() {
      if (view === "radar") renderRadar();
      else if (view === "companies") renderCompanies();
      else if (view === "skills") renderSkills();
      else { view = "radar"; renderRadar(); }
    }

    function syncNav() {
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-view") === view);
      });
    }

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.onclick = async () => {
        const next = btn.getAttribute("data-view");
        if (next === "media") return; // UI 入口已移除
        view = next;
        if (view !== "radar") {
          selectedRadar = null;
          radarMatchItems = [];
          policyBodyText = "";
        }
        syncNav();
        setBusy(true);
        try {
          if (view === "radar") await loadRadar();
          else if (view === "companies") await loadCompanies();
          render();
        } finally { setBusy(false); }
      };
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && view === "radar" && selectedRadar) {
        e.preventDefault();
        closeRadarModal();
      }
    });

    document.getElementById("operator").addEventListener("change", syncOpSeal);
    syncOpSeal();

    (async function init() {
      try {
        await api("/api/health");
        await loadRadar();
        await loadCompanies();
        render();
      } catch (e) {
        setApiStatus("接口不可用", true);
        document.getElementById("content").innerHTML =
          `<div class="empty">无法连接 API<br/>请确认 python3 server.py 已在 :8766 启动</div>`;
      }
    })();
  </script>
</body>
</html>
